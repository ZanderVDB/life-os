<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Life OS">
  <!-- Compact application mark: the sacred lotus alone, no wordmark (a
       wordmark is unreadable at 32px). Deep graphite tile, purple identity. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#221D33"/><stop offset="1" stop-color="#14121D"/>
    </linearGradient>
    <linearGradient id="petal" x1="120" y1="404" x2="392" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D3BFF"/><stop offset="1" stop-color="#C99BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="300" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A5DFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8A5DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <circle cx="256" cy="292" r="200" fill="url(#halo)"/>
  <!-- Lotus scaled to sit inside a generous safe area, optically centred. -->
  <g transform="translate(256 268) scale(15.6) translate(-12 -11.4)">
    <path d="M12 20.4C6.9 17.6 3.4 13.1 3.4 8.5 7.1 9.2 10.1 13 12 20.4Z" fill="url(#petal)" fill-opacity=".8"/>
    <path d="M12 20.4c5.1-2.8 8.6-7.3 8.6-11.9-3.7.7-6.7 4.5-8.6 11.9Z" fill="url(#petal)" fill-opacity=".8"/>
    <path d="M12 2.3C8.6 8 8.6 15 12 20.4 15.4 15 15.4 8 12 2.3Z" fill="url(#petal)"/>
  </g>
</svg>
