<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Life OS">
  <!-- Compact application mark: the sacred lotus alone, no wordmark (a
       wordmark is unreadable at 32px).

       Purple, and opaque to every edge. The previous tile was deep graphite
       with a 114px corner radius, which left the four corners TRANSPARENT —
       and any surface that composites the icon onto white then shows a white,
       square-cornered corner through it. That is what Android's splash was
       drawing. Nothing here has an alpha channel to show anything through.

       Rounding is the platform's job: Android masks to its own shape, iOS
       applies the superellipse. Shipping the rounding ourselves only meant
       shipping the holes as well. -->
  <defs>
    <!-- The same lit-sphere family as the centre button in the bottom bar,
         so the icon you tap and the button you press are the same object. -->
    <radialGradient id="tile" cx=".34" cy=".22" r="1.05">
      <stop offset="0" stop-color="#B78FFF"/>
      <stop offset=".38" stop-color="#9264FF"/>
      <stop offset=".68" stop-color="#7241E8"/>
      <stop offset="1" stop-color="#4E27B4"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".34" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <rect width="512" height="512" fill="url(#rim)"/>
  <!-- Lotus in white, at the bar button's own opacities: the two outer petals
       carry back, the centre petal is full strength. -->
  <g transform="translate(256 262) scale(15.2) translate(-12 -11.4)" fill="#fff">
    <path d="M12 20.4C6.9 17.6 3.4 13.1 3.4 8.5 7.1 9.2 10.1 13 12 20.4Z" fill-opacity=".66"/>
    <path d="M12 20.4c5.1-2.8 8.6-7.3 8.6-11.9-3.7.7-6.7 4.5-8.6 11.9Z" fill-opacity=".66"/>
    <path d="M12 2.3C8.6 8 8.6 15 12 20.4 15.4 15 15.4 8 12 2.3Z"/>
  </g>
</svg>
