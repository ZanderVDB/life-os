<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Life OS">
  <!-- Maskable: Android crops to whatever shape the launcher uses, so the mark
       sits inside the 80% safe zone and the tile bleeds fully to the edges.
       Deliberately a separate drawing, not the standard icon in a bigger box —
       the same art rescaled would put the petals under the crop.

       Same purple as the standard tile, and likewise opaque throughout. -->
  <defs>
    <radialGradient id="mtile" cx=".34" cy=".22" r="1.05">
      <stop offset="0" stop-color="#B78FFF"/>
      <stop offset=".38" stop-color="#9264FF"/>
      <stop offset=".68" stop-color="#7241E8"/>
      <stop offset="1" stop-color="#4E27B4"/>
    </radialGradient>
    <linearGradient id="mrim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".34" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mtile)"/>
  <rect width="512" height="512" fill="url(#mrim)"/>
  <!-- 11.4 put the lotus across 38% of the canvas. Android 12 draws a launcher
       icon very large on its own splash screen, and at that scale it filled
       most of the phone. 8.6 is 29% — still the dominant thing in the icon,
       and a mark rather than a poster once the system blows it up. -->
  <g transform="translate(256 256) scale(8.6) translate(-12 -11.4)" fill="#fff">
    <path d="M12 20.4C6.9 17.6 3.4 13.1 3.4 8.5 7.1 9.2 10.1 13 12 20.4Z" fill-opacity=".66"/>
    <path d="M12 20.4c5.1-2.8 8.6-7.3 8.6-11.9-3.7.7-6.7 4.5-8.6 11.9Z" fill-opacity=".66"/>
    <path d="M12 2.3C8.6 8 8.6 15 12 20.4 15.4 15 15.4 8 12 2.3Z"/>
  </g>
</svg>
