.bk-book.bk-spread{aspect-ratio:420/297;max-width:1320px;
  grid-template-columns:repeat(2,minmax(0,1fr))}

.bk-page{position:relative;background:var(--paper);border-radius:14px;
  padding:28px 32px 18px 58px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:var(--paper-shadow),inset 3px 0 0 0 var(--accent-c,var(--a-peach))}
.bk-page-right{padding:28px 58px 18px 32px;
  box-shadow:var(--paper-shadow),inset -3px 0 0 0 var(--accent-c,var(--a-peach))}
/* Margin stripe — 46px in from the bound edge, mirrored on the right page. */
.bk-page::before{content:'';position:absolute;top:0;bottom:0;left:46px;width:1px;
  background:var(--accent-c,var(--a-peach));opacity:.35}
.bk-page-right::before{left:auto;right:46px}

/* The page title band. An explicit height, so the body grid begins at a stated
   place rather than wherever a font happened to leave it. The editor's rules
   are drawn relative to the editor, so this band cannot shift them — but it
   can shift where the first ruled line SITS on the page, and that should be a
   decision. 60px = two rows of the body grid. */
.bk-page-hdr{flex:0 0 auto;height:60px;margin:0;display:flex;align-items:center;gap:6px}
.bk-page-more,.bk-tab-more{flex:0 0 auto;background:none;border:0;cursor:pointer;
  border-radius:7px;width:24px;height:24px;display:grid;place-items:center;
  color:var(--paper-ink-2);opacity:0;
  transition:opacity var(--t-hover),background var(--t-hover),color var(--t-hover)}
.bk-page:hover .bk-page-more,.bk-page:focus-within .bk-page-more{opacity:.8}
.bk-page-more:hover{background:rgba(255,255,255,.07);color:var(--paper-ink)}
.bk-page-more:focus-visible,.bk-tab-more:focus-visible{opacity:1;
  outline:2px solid var(--accent);outline-offset:1px}
/* The section menu hangs off the ACTIVE tab only — one section is being
   worked on, and a control on every tab is six controls competing. */
.bk-tab-wrap{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
.bk-tab-more{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  color:#1A1624;opacity:.55;width:20px;height:20px}
.bk-tab-wrap:hover .bk-tab-more{opacity:.9}
.bk-tab-wrap:has(.bk-tab.on) .bk-tab{padding-right:28px}
.lib-menu-note{margin:0;padding:9px 11px;font-size:12px;color:var(--muted);line-height:1.5}

.bk-page-title{flex:1;min-width:0;background:none;border:0;outline:0;
  font-family:'Playfair Display',Georgia,serif;font-size:19px;color:var(--paper-ink);
  padding:0 0 6px;border-bottom:1px solid transparent;
  transition:border-color var(--t-hover)}
.bk-page-title{width:100%}
.bk-page-title::placeholder{color:var(--paper-ink-2);opacity:.5}
.bk-page-title:focus{border-bottom-color:var(--accent-c,var(--a-peach))}
.bk-page-body{flex:1;min-height:0;display:flex}

/* RULED PAPER — audit §3, carried verbatim. The repeat cycle equals the
   line-height exactly, and `local` scrolls the rules with the text. It lives
   on the scrolling text element, never on the page: on the page the lines
   drift the moment a heading sits above them. */
/* The ruled area is a whole number of rows, so the page ends ON a rule rather
   than part-way through one, and scrolling moves in whole lines.
   `round()` does the floor in CSS — no JS measuring the layout, no resize
   observer, and it degrades to the plain flex height where it is unsupported. */
.bk-editor{flex:1;min-height:0;height:round(down,100%,30px);
  overflow-y:auto;outline:0;
  color:var(--paper-ink);font-size:15px;line-height:30px;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent 29px,var(--paper-line) 29px,var(--paper-line) 30px);
  background-attachment:local;
  -webkit-overflow-scrolling:touch}
.bk-editor::-webkit-scrollbar{width:6px}
.bk-editor::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ── THE BLOCK GRID (F2.1) ─────────────────────────────────────────────
   ONE formula, applied to every block. Not a set of per-element nudges.

       height = (lead + lines) x 30px

   `lines` is however many ruled lines the text wraps onto — it follows from
   line-height being 30px everywhere, so it needs no declaration.
   `lead` is the number of rows a block claims for its own typography:

       paragraph 0   list 0   quote 0   heading 1   subheading 1

   Two rules make that work, and both matter:

   1. LEAD IS PADDING, NEVER MARGIN. A margin belongs to no element. The
      caret cannot be placed in it, so a 30px margin above a heading drew a
      ruled line nobody could click into — which is exactly the defect this
      section fixes. Padding belongs to the block, so clicking it puts the
      caret in the heading, where it should be.

   2. A LEAD ROW IS UNRULED. `::before` paints paper over the lead, so the
      space a heading owns has no rule in it. A writable blank line always
      has a rule; typography-owned space never does. That is the whole
      visual grammar, and it is why the lead cannot be mistaken for a line
      you should be able to type on.

   Browser defaults are zeroed rather than overridden, so nothing can collapse
   or leak in from the user agent stylesheet. */
.bk-editor > *{margin:0;padding:0;line-height:30px}
.bk-editor p,.bk-editor li,.bk-editor blockquote p{margin:0;line-height:30px}

/* lead: 1 — see the formula above. */
.bk-editor h2,.bk-editor h3{
  position:relative;margin:0;padding:30px 0 0;font-weight:500;
  font-family:'Playfair Display',Georgia,serif;color:var(--paper-ink)}
.bk-editor h2{font-size:23px}
.bk-editor h3{font-size:18px}
.bk-editor h2::before,.bk-editor h3::before{
  content:'';position:absolute;left:0;right:0;top:0;height:30px;
  background:var(--paper);pointer-events:none}

/* lead: 0 — a list is exactly its items, a quote exactly its paragraphs. */
.bk-editor ul,.bk-editor ol{margin:0;padding:0 0 0 24px}
.bk-editor li{margin:0;padding:0}
.bk-editor li::marker{color:var(--paper-ink-2)}
.bk-editor blockquote{margin:0;padding:0 0 0 15px;
  border-left:2px solid var(--accent-c,var(--a-peach));color:var(--paper-ink-2);
  font-style:italic}
.bk-editor a{color:var(--accent-c,var(--a-peach));text-decoration:underline;
  text-underline-offset:2px}
.bk-editor:focus-visible{outline:0}
/* §13 — content from a newer build. Visible, labelled, preserved on save. */
.bk-unknown{border:1px dashed var(--border-strong);border-radius:8px;
  padding:0 12px;margin:0;line-height:30px;color:var(--paper-ink-2);font-size:12.5px;
  background:rgba(255,255,255,.03);user-select:none}

/* The blank companion of an odd final page. A rendering decision, not a row. */
.bk-page-blank{align-items:center;justify-content:center;
  box-shadow:var(--paper-shadow),inset -3px 0 0 0 var(--accent-c,var(--a-peach));
  background:var(--paper-2)}
.bk-page-blank::before{display:none}
.bk-blank{text-align:center;color:var(--paper-ink-2);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.bk-blank p{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:15px;opacity:.75}

/* Arrows — 44px, 48px from 900px up (audit §7). */
.bk-arrow{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;
  transition:background var(--t-hover),color var(--t-hover),transform var(--t-hover),
    opacity var(--t-hover)}
.bk-arrow svg{width:20px;height:20px}
.bk-arrow:hover:not(:disabled){background:var(--surface-2);color:var(--text);transform:scale(1.06)}
.bk-arrow:disabled{opacity:.3;cursor:default}
.bk-arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:900px){.bk-arrow{width:48px;height:48px}}

/* Tabs — audit §4. Round on top, square at the bottom; never wraps. */
.bk-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:5px;width:100%;max-width:1320px;
  padding:0 52px 0;border-bottom:1px dashed var(--border);scrollbar-width:thin}
.bk-tabs::-webkit-scrollbar{height:4px}
.bk-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bk-tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;
  border-radius:20px 20px 4px 4px;border:0;cursor:pointer;
  font-family:'Playfair Display',Georgia,serif;font-size:12px;font-weight:600;
  padding:8px 15px 7px;background:var(--surface-2);color:var(--text-2);
  transition:background var(--t-hover),color var(--t-hover),transform var(--t-hover)}
.bk-tab:hover{transform:translateY(-1px);color:var(--text)}
.bk-tab.on{background:var(--accent-c,var(--a-peach));color:#1A1624}
.bk-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bk-tab-n{font-family:Inter,sans-serif;font-size:9.5px;font-weight:700;opacity:.65;
  font-variant-numeric:tabular-nums}
.bk-tab-add{background:none;border:1px dashed var(--border-strong);color:var(--muted);
  font-size:15px;padding:6px 13px 5px}

/* Cover — audit §5. */
.bk-stage-cover .bk-book{max-width:560px}
.bk-cover-page{padding:0;box-shadow:var(--paper-shadow),inset 3px 0 0 0 var(--a-peach)}
.bk-cover-page::before{left:22px;opacity:.22}
.bk-cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:46px 40px 34px;gap:0}
.bk-cover-mark{font-family:'Playfair Display',Georgia,serif;font-size:13px;
  color:var(--a-peach);opacity:.8;margin-bottom:auto}
.bk-cover-pre{font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
  color:var(--paper-ink-2);margin-bottom:16px}
.bk-cover-title{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:64px;
  line-height:1.06;color:var(--paper-ink);margin:0}
.bk-cover-sub{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:17px;
  color:var(--paper-ink-2);margin:12px 0 0}
.bk-cover-rule{width:140px;height:1px;background:var(--paper-ink-2);opacity:.4;margin:32px 0}
.bk-cover-author{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--paper-ink-2);margin:0}
.bk-open{margin-top:auto}

/* Foot: where you are, and whether it is saved. */
.bk-foot{display:flex;align-items:center;gap:14px;width:100%;max-width:1320px;
  padding:0 52px;font-size:11.5px;color:var(--muted)}
.bk-context{font-variant-numeric:tabular-nums}
.bk-save{margin-left:auto;display:flex;align-items:center;gap:8px;
  /* Fixed width so a status change never nudges the layout while typing. */
  min-width:112px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.bk-save[data-state="saved"]{color:var(--ok)}
.bk-save[data-state="saving"]{color:var(--text-2)}
.bk-save[data-state="unsaved"]{color:var(--warn)}
.bk-save[data-state="failed"],.bk-save[data-state="conflict"]{color:var(--danger)}
.bk-retry{background:var(--surface-2);border:0;border-radius:6px;color:var(--text);
  font-size:11px;padding:3px 8px;cursor:pointer;font-family:inherit}
.bk-retry:hover{background:var(--surface-3)}

/* Toolbar — restrained. A ribbon in a book is a word processor in disguise. */
.bk-toolbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:5px 7px;box-shadow:var(--e1)}
.bk-tb{width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;
  color:var(--text-2);font-size:13px;display:grid;place-items:center;font-family:inherit;
  transition:background var(--t-hover),color var(--t-hover)}
.bk-tb:hover{background:var(--surface-2);color:var(--text)}
.bk-tb.on{background:var(--accent-soft);color:#fff}
.bk-tb:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.bk-tb-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.bk-tb-style{background:var(--surface-2);border:0;border-radius:8px;color:var(--text);
  font-size:12px;font-family:inherit;padding:6px 8px;cursor:pointer;outline:0}
.bk-tb-search{margin-left:4px;font-size:16px}

.bk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;
  max-width:1320px;padding:0 52px}
.bk-head-title{font-family:'Playfair Display',Georgia,serif;font-size:19px;color:var(--text);
  margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-head-acts{margin-left:auto;display:flex;align-items:center;gap:8px}

/* Link prompt — never window.prompt (§24). */
.bk-linkbox{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:120;
  background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--e3);padding:16px;width:min(360px,calc(100vw - 40px));
  display:flex;flex-direction:column;gap:12px}
.bk-linkbox label{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.bk-linkbox input{background:var(--surface);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;color:var(--text);font-size:13px;outline:0;font-family:inherit}
.bk-linkbox input:focus{border-color:var(--accent)}
.bk-linkbox-acts{display:flex;gap:8px;justify-content:flex-end}

/* Within-book search. */
.bk-search{position:absolute;top:0;right:0;width:min(370px,100%);z-index:8;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--e3);padding:12px;display:flex;flex-direction:column;gap:10px;
  max-height:min(460px,70vh)}
.bk-search-top{display:flex;gap:8px;align-items:center}
.bk-search-input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px;outline:0;font-family:inherit}
.bk-search-input:focus{border-color:var(--accent)}
.bk-search-hint{font-size:12.5px;color:var(--muted);margin:0;padding:6px 2px}
.bk-search-list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;
  flex-direction:column;gap:3px}
.bk-search-hit{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-family:inherit;
  transition:background var(--t-hover)}
.bk-search-hit:hover{background:var(--surface-2)}
.bk-search-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bk-hit-where{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted)}
.bk-hit-text{font-size:12.5px;color:var(--text-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Page turn — audit §6. Both pages move together so it reads as one motion.
   No 3D curl: `perspective` is declared and deliberately unused. */
@keyframes bkLeaveLeft{to{transform:translateX(-14%);opacity:0}}
@keyframes bkLeaveRight{to{transform:translateX(14%);opacity:0}}
@keyframes bkEnterLeft{from{transform:translateX(14%);opacity:0}}
@keyframes bkEnterRight{from{transform:translateX(-14%);opacity:0}}
.bk-book.leave-next{animation:bkLeaveLeft .26s cubic-bezier(.4,0,.2,1) forwards}
.bk-book.leave-prev{animation:bkLeaveRight .26s cubic-bezier(.4,0,.2,1) forwards}
.bk-book.enter-next{animation:bkEnterLeft .26s cubic-bezier(.4,0,.2,1)}
.bk-book.enter-prev{animation:bkEnterRight .26s cubic-bezier(.4,0,.2,1)}

/* ═══════════════════════════════════════════════════════════════════════
   DIARY (Phase D1)
   One generous journal page, not a Book spread. Diary borrows the ruled
   paper and the F2.1 block grid — the parts of the Book that exist to make
   WRITING read well — and none of its furniture: no cover, no two-page
   spread, no section tabs, no page turn, no coloured page edge.
   ═══════════════════════════════════════════════════════════════════════ */
body:has(.dia-page) .main-wrap{grid-template-columns:minmax(0,1fr) 0}
body:has(.dia-page) .rail{display:none}

.dia{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}

/* Date navigation — two labelled pairs, because Day and Entry are different. */
.dia-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  width:100%;max-width:760px}
.dia-nav-group{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:3px}
.dia-nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:0 6px}
.dia-step{width:30px;height:30px;border-radius:7px;border:0;background:none;cursor:pointer;
  color:var(--text-2);display:grid;place-items:center;font-size:15px;font-family:inherit;
  transition:background var(--t-hover),color var(--t-hover)}
.dia-step:hover{background:var(--surface-2);color:var(--text)}
.dia-step:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dia-pick{margin-left:auto;display:flex;align-items:center}
.dia-pick input{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  color:var(--text-2);font-family:inherit;font-size:12.5px;padding:8px 10px;
  color-scheme:dark;cursor:pointer}
.dia-pick input:focus{outline:0;border-color:var(--accent)}

/* The sheet. Paper depth and a soft boundary — no big rounded dashboard card. */
.dia-sheet{width:100%;max-width:760px;background:var(--paper);border-radius:16px;
  padding:34px 40px 20px;box-shadow:var(--paper-shadow);
  display:flex;flex-direction:column;min-height:min(72vh,640px);
  border-top:3px solid var(--accent)}
.dia-sheet-head{flex:0 0 auto;padding-bottom:16px;margin-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,.06)}
.dia-day{margin:0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--paper-ink-2)}
.dia-date{margin:6px 0 0;font-family:'Playfair Display',Georgia,serif;font-weight:500;
  font-size:30px;line-height:1.15;color:var(--paper-ink)}
.dia-title{width:100%;margin-top:10px;background:none;border:0;outline:0;font-family:inherit;
  font-size:15px;color:var(--paper-ink);padding:4px 0;
  border-bottom:1px solid transparent;transition:border-color var(--t-hover)}
.dia-title::placeholder{color:var(--paper-ink-2);opacity:.55}
.dia-title:focus{border-bottom-color:var(--accent)}

.dia-body{flex:1;min-height:0;display:flex;margin-top:12px}

/* RULED PAPER and the F2.1 BLOCK GRID, carried over exactly.
   height = (lead + lines) x 30px. Lead is padding, and a lead row is unruled. */
.dia-editor{flex:1;min-height:300px;outline:0;
  color:var(--paper-ink);font-size:15.5px;line-height:30px;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent 29px,var(--paper-line) 29px,var(--paper-line) 30px);
  background-attachment:local}
.dia-editor > *{margin:0;padding:0;line-height:30px}
.dia-editor p,.dia-editor li,.dia-editor blockquote p{margin:0;line-height:30px}
.dia-editor h2,.dia-editor h3{position:relative;margin:0;padding:30px 0 0;font-weight:500;
  font-family:'Playfair Display',Georgia,serif;color:var(--paper-ink)}
.dia-editor h2{font-size:23px}
.dia-editor h3{font-size:18px}
.dia-editor h2::before,.dia-editor h3::before{content:'';position:absolute;left:0;right:0;
  top:0;height:30px;background:var(--paper);pointer-events:none}
.dia-editor ul,.dia-editor ol{margin:0;padding:0 0 0 24px}
.dia-editor li{margin:0;padding:0}
.dia-editor li::marker{color:var(--paper-ink-2)}
.dia-editor blockquote{margin:0;padding:0 0 0 15px;border-left:2px solid var(--accent);
  color:var(--paper-ink-2);font-style:italic}
.dia-editor a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.dia-editor .bk-unknown{border:1px dashed var(--border-strong);border-radius:8px;
  padding:0 12px;line-height:30px;color:var(--paper-ink-2);font-size:12.5px;
  background:rgba(255,255,255,.03);user-select:none}
/* A contenteditable is never :empty — it holds <p><br></p> — so the prompt is
   driven by the same text test the server uses to decide if a day is real. */
.dia-editor.is-empty::before{content:attr(data-placeholder);color:var(--paper-ink-2);
  opacity:.45;pointer-events:none;position:absolute;line-height:30px}
.dia-body{position:relative}
.dia-editor.is-found{animation:diaFound 1.4s ease-out}
@keyframes diaFound{0%,60%{background-color:rgba(138,93,255,.10)}100%{background-color:transparent}}

/* Toolbar — the same restrained set as the Book, in Diary's chrome. */
.dia-toolbar{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:14px;
  padding:5px 6px;border-radius:10px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05)}
.dia-tb{width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;
  color:var(--paper-ink-2);font-size:13px;display:grid;place-items:center;font-family:inherit;
  transition:background var(--t-hover),color var(--t-hover)}
.dia-tb:hover{background:rgba(255,255,255,.07);color:var(--paper-ink)}
.dia-tb.on{background:var(--accent-soft);color:#fff}
.dia-tb:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.dia-tb-sep{width:1px;height:18px;background:rgba(255,255,255,.09);margin:0 4px}
.dia-tb-style{background:rgba(255,255,255,.06);border:0;border-radius:8px;color:var(--paper-ink);
  font-size:12px;font-family:inherit;padding:6px 8px;cursor:pointer;outline:0}

/* Optional context — collapsed, never a form you must complete. */
.dia-context{margin-top:18px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px}
.dia-context-toggle{display:flex;align-items:center;gap:8px;background:none;border:0;
  cursor:pointer;color:var(--paper-ink-2);font-family:inherit;font-size:12.5px;
  padding:6px 0;transition:color var(--t-hover)}
.dia-context-toggle:hover{color:var(--paper-ink)}
.dia-context-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dia-context-n{font-size:10px;font-weight:700;background:var(--accent-soft);color:#fff;
  border-radius:6px;padding:1px 6px}
.dia-chev{font-size:10px;opacity:.7}
.dia-context-body{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  padding:10px 0 4px}
.dia-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.dia-field-wide{grid-column:1/-1}
.dia-field label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--paper-ink-2)}
.dia-field input,.dia-field select,.dia-field textarea{background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);border-radius:9px;color:var(--paper-ink);
  font-family:inherit;font-size:13px;padding:8px 10px;outline:0;resize:vertical}
.dia-field input:focus,.dia-field select:focus,.dia-field textarea:focus{border-color:var(--accent)}
.dia-field input::placeholder,.dia-field textarea::placeholder{color:var(--paper-ink-2);opacity:.5}

.dia-foot{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:var(--paper-ink-2)}
.dia-hint{flex:1;min-width:0}
/* Fixed width, so the status changing while you type never moves the layout. */
.dia-save{min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.dia-save[data-state="saved"]{color:var(--ok)}
.dia-save[data-state="saving"]{color:var(--paper-ink-2)}
.dia-save[data-state="unsaved"]{color:var(--warn)}
.dia-save[data-state="failed"],.dia-save[data-state="conflict"]{color:var(--danger)}
.dia-archive{background:none;border:0;color:var(--paper-ink-2);font-family:inherit;
  font-size:11.5px;cursor:pointer;padding:4px 8px;border-radius:7px;
  transition:background var(--t-hover),color var(--t-hover)}
.dia-archive:hover{background:rgba(255,255,255,.06);color:var(--danger)}

.dia-sheet-archived{min-height:auto}
.dia-arch-badge{margin:10px 0 0;display:inline-block;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:rgba(255,255,255,.06);border-radius:6px;padding:3px 9px}
.dia-arch-body{padding:22px 0 8px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dia-arch-lead{margin:0;font-size:15px;color:var(--paper-ink)}
.dia-arch-note{margin:0;font-size:13px;color:var(--paper-ink-2);line-height:1.6;max-width:44ch}
.dia-sheet-skel{gap:0}

/* ── History ──────────────────────────────────────────────────────────── */
.dia-history{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;
  align-items:start;width:100%}
.dia-hist-main{min-width:0;display:flex;flex-direction:column;gap:16px}
.dia-searchbar{display:flex;gap:8px;align-items:center}
.dia-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:0 12px;height:38px;color:var(--muted);
  transition:border-color var(--t-hover)}
.dia-search:focus-within{border-color:var(--accent)}
.dia-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
  font-size:13px;font-family:inherit}
.dia-search input::placeholder{color:var(--muted)}

.dia-cal{background:var(--surface);border-radius:16px;padding:18px 20px 14px;box-shadow:var(--e2)}
.dia-cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px}
.dia-cal-title{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:19px;
  font-weight:500;color:var(--text)}
.dia-grid{display:flex;flex-direction:column;gap:3px}
.dia-grid-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dia-grid-head span{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.dia-day-cell{position:relative;aspect-ratio:1;min-height:38px;border:0;border-radius:9px;
  background:none;cursor:pointer;color:var(--text-2);font-family:inherit;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:background var(--t-hover),color var(--t-hover)}
.dia-day-cell:hover{background:var(--surface-2);color:var(--text)}
.dia-day-cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dia-day-cell.is-outside{color:var(--muted);opacity:.45}
/* Presence is carried three ways — a dot, a bolder weight and the accessible
   name — so nothing depends on distinguishing a colour. */
.dia-day-cell.has-entry .dia-day-n{font-weight:700;color:var(--text)}
.dia-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);display:block}
.dia-day-cell.is-today{box-shadow:inset 0 0 0 1px var(--border-strong)}
.dia-day-cell.is-open{background:var(--accent-soft);color:#fff}
.dia-cal-key{display:flex;align-items:center;gap:7px;margin:14px 0 0;font-size:11.5px;
  color:var(--muted)}

.dia-hist-side{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--e2)}
.dia-side-h{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.dia-side-empty{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.dia-recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.dia-recent-row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;font-family:inherit;
  transition:background var(--t-hover)}
.dia-recent-row:hover{background:var(--surface-2)}
.dia-recent-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dia-recent-when{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted)}
.dia-recent-title{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.dia-recent-mood{font-size:10.5px;color:var(--muted)}

.dia-results{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--e2)}
.dia-result-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.dia-result{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;
  border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-family:inherit;
  transition:background var(--t-hover)}
.dia-result:hover{background:var(--surface-2)}
.dia-result:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dia-result-when{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted)}
.dia-result-title{font-size:13.5px;font-weight:600;color:var(--text)}
.dia-result-text{font-size:12.5px;color:var(--text-2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dia-empty{max-width:460px;margin:30px auto}

/* Motion — the sheet moves directionally, the frame never does. No page curl:
   Diary is chronological, not a physical book. */
@keyframes diaLeaveNext{to{transform:translateX(-3%);opacity:0}}
@keyframes diaLeavePrev{to{transform:translateX(3%);opacity:0}}
@keyframes diaEnterNext{from{transform:translateX(3%);opacity:0}}
@keyframes diaEnterPrev{from{transform:translateX(-3%);opacity:0}}
.dia-sheet.leave-next{animation:diaLeaveNext var(--d-base) var(--e-inout) forwards}
.dia-sheet.leave-prev{animation:diaLeavePrev var(--d-base) var(--e-inout) forwards}
.dia-sheet.enter-next{animation:diaEnterNext var(--d-base) var(--e-out)}
.dia-sheet.enter-prev{animation:diaEnterPrev var(--d-base) var(--e-out)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:1080px){
  .dia-history{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .dia-sheet{padding:24px 22px 16px;border-radius:14px;min-height:auto}
  .dia-date{font-size:25px}
  .dia-nav{max-width:none}
  .dia-pick{margin-left:0;width:100%}
  .dia-pick input{width:100%}
  /* A finger needs the whole day, not a 38px square inside it. */
  .dia-day-cell{min-height:44px}
  .dia-step{width:44px;height:44px}
  .dia-toolbar{position:sticky;top:0;z-index:2;background:var(--paper);
    border-color:rgba(255,255,255,.08);margin-left:-4px;margin-right:-4px;padding:6px 4px}
}
@media (max-width:480px){
  .dia-sheet{padding:20px 16px 14px}
  .dia-date{font-size:22px}
  .dia-editor{font-size:15px}
  .dia-context-body{grid-template-columns:minmax(0,1fr)}
  .dia-nav-group{flex:1;justify-content:center}
}

/* ── Library responsive (§27) ─────────────────────────────────────────── */
@media (max-width:1180px){
  .bk-tabs,.bk-foot,.bk-head{padding-left:0;padding-right:0}
}
@media (max-width:1024px){
  .bk-stage{gap:6px}
  .bk-page{padding:22px 24px 14px 46px}
  .bk-page-right{padding:22px 46px 14px 24px}
  .bk-page::before{left:38px}
  .bk-page-right::before{left:auto;right:38px}
  .bk-cover-title{font-size:46px}
}
@media (max-width:820px){
  /* One page at a time. A 420:297 spread on a phone is two unreadable columns,
     so the spread becomes a single page and the arrows step page by page. */
  .bk-book.bk-spread{aspect-ratio:210/297;grid-template-columns:minmax(0,1fr);max-width:520px}
  .bk-book.bk-spread .bk-page-right{display:none}
  .bk-book.bk-spread.show-right .bk-page-left{display:none}
  .bk-book.bk-spread.show-right .bk-page-right{display:flex}
  .lib-bar-right{margin-left:0;width:100%}
  .lib-search{flex:1}
  .lib-search input{width:100%}
  .bk-arrow{width:44px;height:44px}
  .bk-search{position:fixed;left:12px;right:12px;top:70px;width:auto}
}
@media (max-width:480px){
  .bk-page{padding:18px 18px 12px 38px}
  .bk-page-right{padding:18px 38px 12px 18px}
  .bk-page::before{left:30px}
  .bk-page-right::before{left:auto;right:30px}
  .bk-cover-title{font-size:42px}
  .bk-cover{padding:32px 24px 24px}
  .lib-grid{grid-template-columns:minmax(0,1fr)}
  .bk-toolbar{width:100%;justify-content:center}

  /* On a phone the arrows sat IN the row and took 100px of a 321px column —
     a third of the screen, leaving a 221px page nobody can write on. They move
     over the outer edges of the page instead: the 44px target is kept, the
     page gets the full width, and the control stays where the thumb already is. */
  .bk-stage{position:relative;gap:0}
  .bk-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    background:rgba(20,18,32,.72);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.1)}
  .bk-arrow:hover:not(:disabled){transform:translateY(-50%) scale(1.06)}
  #bk-prev{left:2px}
  #bk-next{right:2px}
  .bk-arrow:disabled{opacity:.22}
  /* The text keeps clear of what is now sitting on top of it. */
  .bk-page{padding-left:46px;padding-right:26px}
  .bk-page-right{padding-left:26px;padding-right:46px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;animation-iteration-count:1!important;
    transition-duration:1ms!important;scroll-behavior:auto!important}
}
html[data-motion="reduced"] *{animation-duration:1ms!important;transition-duration:1ms!important}
</style>
</head>

<div class="drawer-scrim" id="drawer-scrim" aria-hidden="true"></div>
