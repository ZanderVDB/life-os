.cm-cell.is-selected .cm-date{color:var(--text);font-weight:700}
.cm-cell:focus-visible{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(138,93,255,.20)}
.cm-flag{font-size:10px;font-weight:800;color:var(--danger);margin-left:auto;
  width:13px;height:13px;border-radius:50%;background:rgba(240,86,110,.14);
  display:grid;place-items:center}
.cm-flag.is-warn{color:var(--warn);background:rgba(255,196,77,.14)}
.cm-chip{min-width:15px;height:15px;display:inline-grid;place-items:center}
.cm-rem{background:rgba(255,196,77,.16);color:var(--warn)}

/* ── Hover preview ── */
.hov{position:fixed;z-index:300;width:264px;max-width:calc(100vw - 24px);
  background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:var(--e3);padding:11px 13px;pointer-events:auto;
  display:flex;flex-direction:column;gap:7px}
/* MUST come after the rule above. `display:flex` on .hov beats the UA's
   `[hidden]{display:none}` — author styles outrank the user agent — so the
   preview shell rendered permanently as an empty 264px rounded bar floating
   over every Calendar mode. Any element that is both `hidden` and given a
   display value needs this. */
.hov[hidden]{display:none}
.hov-head{display:flex;align-items:baseline;justify-content:space-between;gap:9px}
.hov-head b{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35}
.hov-load{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);flex-shrink:0}
.hov-load.load-busy{color:var(--warn)}
.hov-load.load-overloaded{color:var(--danger)}
.hov-next{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);
  min-width:0}
.hov-next i{width:3px;height:14px;border-radius:2px;flex-shrink:0}
.hov-next span{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.hov-next b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hov-when{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.hov-counts,.hov-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:10.5px;color:var(--muted)}
.hov-counts span,.hov-meta span{background:var(--surface-3);border-radius:5px;padding:1px 6px}
.hov-counts .is-due{color:var(--p-high-ink)}
.hov-counts .is-rem{color:var(--warn)}
.hov-counts .is-plan{color:var(--p-low-ink)}
.hov-counts .is-clash{color:var(--danger);background:rgba(240,86,110,.12)}
.hov-cal{display:inline-flex;align-items:center;gap:5px}
.hov-cal i{width:6px;height:6px;border-radius:50%}
.hov-meet{color:var(--p-low-ink)}
.hov-ro{color:var(--muted)}

/* ── Selected-day rail ── */
.cs-empty{display:flex;flex-direction:column;gap:3px;padding:14px 0 16px}
.cs-empty-t{font-size:13px;font-weight:600;color:var(--text-2)}
.cs-empty-s{font-size:11.5px;color:var(--muted);line-height:1.5}
.cs-load{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);
  margin-bottom:12px}
.cs-load i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.cs-load.load-moderate i{background:var(--accent)}
.cs-load.load-busy i{background:var(--warn)}
.cs-load.load-overloaded i{background:var(--danger)}
.cs-alert{display:flex;flex-direction:column;gap:4px;padding:8px 10px;margin-bottom:12px;
  border-radius:9px;background:rgba(240,86,110,.08);border-left:2px solid var(--danger)}
.cs-alert span{font-size:11px;color:var(--text-2);line-height:1.45}
.cs-alert b{font-weight:600;color:var(--text)}
.cs-row.is-done b{color:var(--muted);text-decoration:line-through}
/* ── Habits on the selected day ──
   Rows, not a summary line: the point is that each one can be corrected. */
.cs-habits{margin-top:4px;padding-top:8px;border-top:1px solid var(--hairline)}
.cs-habit-count{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.cs-habit-note{font-size:11px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.cs-habit-note.is-err{color:var(--danger)}
.cs-habit-row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;
  margin-left:-6px;border:0;background:none;border-radius:7px;cursor:pointer;
  text-align:left;transition:background var(--t-fast)}
.cs-habit-row:hover{background:var(--surface-3)}
.cs-habit-row b{font-size:11.5px;font-weight:500;color:var(--text-2);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cs-habit-row.is-done b{color:var(--muted)}
/* Same construction as the step tick in the task editor: a real checkmark
   glyph, revealed by giving it a colour. It was two crossing CSS gradients,
   which met off-centre and read as a leaning crucifix rather than a tick. */
.cs-habit-tick{width:16px;height:16px;border-radius:5px;flex-shrink:0;
  border:1.5px solid var(--border-strong);
  display:grid;place-items:center;color:transparent;
  transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.cs-habit-row:hover .cs-habit-tick{border-color:var(--ok)}
.cs-habit-row.is-done .cs-habit-tick{background:var(--ok);border-color:var(--ok);
  color:#08221c}
.cs-habit-n{margin-left:auto;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums}

/* ── Calendar sources / connection ── */
.cs-connect-copy{font-size:12.5px;color:var(--text-2);line-height:1.55;margin:0 0 10px}
.cs-connect-list{margin:0 0 14px;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.cs-connect-list li{font-size:11.5px;color:var(--muted);line-height:1.45}
.cs-connect{width:100%}
.cs-account{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
  background:var(--surface-2);margin-bottom:11px}
.cs-acct-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cs-acct-dot.is-ok{background:var(--ok)}
.cs-acct-dot.is-error{background:var(--danger)}
.cs-acct-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.cs-acct-body b{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cs-acct-body span{font-size:10.5px;color:var(--muted)}
.cs-sources{display:flex;flex-direction:column;gap:2px;margin-bottom:11px}
.cs-source{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:7px;
  cursor:pointer;transition:background var(--t-hover)}
.cs-source:hover{background:rgba(255,255,255,.035)}
/* Custom box — the native checkbox square was explicitly ruled out. */
.cs-source input{position:absolute;opacity:0;width:0;height:0}
.cs-box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);
  flex-shrink:0;position:relative;transition:background var(--t-hover),border-color var(--t-hover)}
.cs-source input:checked+.cs-box{background:var(--accent);border-color:var(--accent)}
.cs-source input:checked+.cs-box::after{content:"";position:absolute;left:4.5px;top:1.5px;
  width:4px;height:8px;border:solid #fff;border-width:0 1.7px 1.7px 0;transform:rotate(45deg)}
.cs-source input:focus-visible+.cs-box{box-shadow:0 0 0 3px rgba(138,93,255,.22)}
.cs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cs-name{flex:1;min-width:0;font-size:12px;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cs-ro{font-size:9.5px;color:var(--muted);background:var(--surface-2);border-radius:4px;
  padding:1px 5px;flex-shrink:0}
.cs-sync{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--muted);padding-top:9px;border-top:1px solid var(--hairline)}
.cs-sync-now{height:28px;font-size:11.5px;padding:0 10px}
.cs-disconnect{margin-top:9px;font-size:11px;color:var(--muted);
  transition:color var(--t-hover)}
.cs-disconnect:hover{color:var(--danger)}

/* ── Plan queue cards ── */
.pq-list{display:flex;flex-direction:column;gap:6px}
.pq-card{background:var(--surface-2);border-radius:10px;padding:9px 10px;
  border-left:2.5px solid var(--p-marker,var(--muted));cursor:grab;
  display:flex;flex-direction:column;gap:6px;
  transition:background var(--t-hover),transform var(--d-fast) var(--e-out)}
.pq-card:hover{background:var(--surface-3)}
.pq-card:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(138,93,255,.22)}
.pq-card.pri-urgent{--p-marker:var(--p-urgent)}
.pq-card.pri-high{--p-marker:var(--p-high)}
.pq-card.pri-medium{--p-marker:var(--p-medium)}
.pq-card.pri-low{--p-marker:var(--p-low)}
.pq-card.pri-someday{--p-marker:var(--p-someday)}
.pq-top{display:flex;align-items:flex-start;gap:8px}
.pq-title{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.35}
/* The Schedule button is the non-drag path. It appears on hover and focus, but
   is always reachable by keyboard and always present on touch. */
.pq-sched{flex-shrink:0;height:24px;padding:0 9px;border-radius:7px;font-size:11px;
  font-weight:600;background:var(--accent-soft);color:var(--text);
  opacity:0;transition:opacity var(--t-hover),background var(--t-hover)}
.pq-card:hover .pq-sched,.pq-card:focus-within .pq-sched,.pq-sched:focus-visible{opacity:1}
.pq-sched:hover{background:var(--accent);color:#fff}
.pq-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pq-meta>span{font-size:10px;color:var(--muted);background:var(--surface);
  border-radius:4px;padding:1px 5px}
.pq-area{color:var(--text-2)}
.pq-due.is-soon{color:var(--p-high-ink);background:rgba(240,145,61,.12)}
.pq-pri{text-transform:capitalize}
.pri-dot-urgent{color:var(--p-urgent-ink)}
.pri-dot-high{color:var(--p-high-ink)}
.pri-dot-low{color:var(--p-low-ink)}

/* ── Plan canvas: outside planning hours recedes ── */
.pl-outside{position:absolute;left:0;right:0;background:rgba(0,0,0,.16);
  pointer-events:none;z-index:1}
.pl-now{position:absolute;left:0;right:0;height:1.5px;background:var(--accent);
  z-index:2;pointer-events:none}
.pl-now::before{content:"";position:absolute;left:-3px;top:-2.75px;width:7px;height:7px;
  border-radius:50%;background:var(--accent)}
.pl-free{position:absolute;left:3px;right:3px;border-radius:6px;
  background:rgba(138,93,255,.045);border:1px dashed rgba(138,93,255,.18);
  pointer-events:none}

/* ── Reminder modal ── */
.modal-reminder{width:min(520px,calc(100vw - 40px));position:fixed}
.rm-mark{width:9px;height:9px;border-radius:2px;background:var(--warn);flex-shrink:0;
  margin-top:13px;transform:rotate(45deg)}

/* ── Event editor: wider, better hierarchy, Life OS scrollbar ── */
.modal-event{width:min(720px,calc(100vw - 48px))}
.ev-head .m-title{font-size:21px;font-weight:600;line-height:1.3}
.modal-reminder .m-title{font-size:19px;font-weight:600}
.ev-row{grid-template-columns:88px 1fr auto;gap:12px;min-height:46px;padding:5px 0}
.ev-when{padding-bottom:10px;margin-bottom:12px}
.ev-adv{padding-top:10px;margin-top:10px;gap:4px}
/* The bright native scrollbar is replaced, not merely narrowed. */
.ev-body{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;
  padding-right:6px}
.ev-body::-webkit-scrollbar{width:9px}
.ev-body::-webkit-scrollbar-track{background:transparent}
.ev-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;
  border:2.5px solid var(--surface)}
.ev-body::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* Colour swatches read as a set, not as loose buttons. */
.ev-swatches{gap:5px;padding:6px;background:var(--surface-2);border-radius:10px}
.ev-swatch{width:24px;height:24px;border-radius:7px}
.dp-today{width:100%;height:30px;margin-top:7px;border-radius:8px;font-size:11.5px;
  font-weight:600;color:var(--text-2);background:var(--surface-3);
  transition:color var(--t-hover)}
.dp-today:hover{color:var(--text)}
.tp-clear{color:var(--muted);font-style:italic}

/* ── Add menu with icons ── */
.cal-menu button{flex-direction:row;align-items:center;gap:10px}
.cm-add-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  flex-shrink:0;background:var(--surface-2)}
.cm-add-ico i{width:8px;height:8px;border-radius:50%}
.cm-add-body{display:flex;flex-direction:column;gap:1px;min-width:0}

@media (max-width:900px){
}
@media (max-width:640px){
  .modal-reminder{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:92vh;border-radius:20px 20px 0 0}
  .hov{display:none}
}

/* ══ D4.2 — CONSOLIDATION AND CLARITY ═══════════════════════════════════ */

/* ── §4 Centring ────────────────────────────────────────────────────────
   Month, Agenda and Plan share ONE outer bound, so the canvas never shifts
   horizontally when you change mode. Previously each mode found its own width
   and Agenda in particular sat far left in a wide window. */
.cal-head,.cal-month,.cal-agenda,.cal-plan{width:100%;max-width:var(--cal-max);
  margin-inline:auto}
:root{--cal-max:1180px}

@media (min-width:1600px){:root{--cal-max:1340px}}
@media (min-width:2100px){:root{--cal-max:1520px}}

/* ── §3 Header as one system ────────────────────────────────────────────
   Mode control and Add share a height, a radius and a baseline. They are two
   separate controls that look like they were designed together. */
.cal-head{display:flex;flex-direction:column;gap:14px}
.cal-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.cal-head-sub{align-items:center}
.cal-head-main{display:flex;flex-direction:column;gap:9px;min-width:0}
.cal-head-side{display:flex;align-items:center;gap:10px;flex-shrink:0}

.cal-period{display:flex;align-items:center;gap:3px}
.cal-period-label{font-size:15px;font-weight:600;color:var(--text-2);
  min-width:168px;padding:0 4px;
  transition:opacity var(--d-fast) var(--e-out)}
.cal-period-label.is-swapping{opacity:0}
.cal-nav{width:30px;height:30px;border-radius:9px;color:var(--muted);
  display:grid;place-items:center;
  transition:background var(--t-hover),color var(--t-hover)}
.cal-nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.cal-nav:hover{background:var(--surface-2);color:var(--text)}
.cal-nav:active{transform:scale(.94)}
.cal-today{height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--muted);transition:background var(--t-hover),color var(--t-hover)}
.cal-today:hover{background:var(--surface-2);color:var(--text)}

/* Mode control: one track, one sliding pill. */
.cal-modes{position:relative;display:flex;height:38px;padding:3px;border-radius:11px;
  background:var(--surface-2);flex-shrink:0}
.cal-mode-pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:8px;
  width:calc((100% - 6px) / var(--mode-n));
  transform:translateX(calc(var(--mode-i) * 100%));
  background:var(--accent);box-shadow:0 2px 8px rgba(124,77,255,.30);
  transition:transform var(--t-select)}
.cal-modes button{position:relative;z-index:1;height:32px;padding:0 15px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  transition:color var(--t-select)}
.cal-modes button:hover{color:var(--text-2)}
.cal-modes button[aria-selected="true"]{color:#fff}
.cal-modes button:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(138,93,255,.55)}

/* Add: same height and radius family as the mode track. */
.cal-add{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px 0 13px;
  border-radius:11px;font-size:13px;font-weight:600;color:#fff;
  background:var(--brand);box-shadow:var(--glow);
  transition:transform var(--d-fast) var(--e-out),box-shadow var(--t-hover)}
.cal-add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round}
.cal-add:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,77,255,.34)}
.cal-add:active{transform:translateY(0) scale(.98)}
.cal-add[aria-expanded="true"]{box-shadow:0 0 0 3px rgba(138,93,255,.25)}

/* ── §24 Legend ── */
.cal-legend-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:8px;font-size:11.5px;font-weight:500;color:var(--muted);
  transition:background var(--t-hover),color var(--t-hover)}
.cal-legend-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round}
.cal-legend-btn:hover{background:var(--surface-2);color:var(--text-2)}
/* Contents only. Position, width, border, shadow and padding belong to the
   shared .util-surface shell — that is what makes Sources and Key the same
   object. See the D4.7 block. */
.legend{display:flex;flex-direction:column;gap:13px}
.legend h4{margin:0;font-size:12.5px;font-weight:600;color:var(--text)}
.lg-group{display:flex;flex-direction:column;gap:6px}
.lg-lab{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted)}
.lg-row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--text-2);
  line-height:1.4}
.lg-row b{font-weight:600;color:var(--text)}
.lg-row>i{flex-shrink:0}
.lg-src{width:3px;height:14px;border-radius:2px;background:var(--accent)}
.lg-due{width:7px;height:7px;background:var(--p-high);transform:rotate(45deg)}
.lg-rem{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.lg-plan{width:8px;height:8px;border-radius:2px;background:var(--p-low)}
.lg-clash{width:13px;height:13px;border-radius:50%;background:rgba(240,86,110,.16)}
.lg-load{width:3px;height:16px;border-radius:2px;background:var(--border-strong)}
.lg-load.load-busy{background:var(--warn)}
.lg-load.load-overloaded{background:var(--danger)}
.lg-note{margin:0;font-size:11px;color:var(--muted);line-height:1.5;
  padding-top:11px;border-top:1px solid var(--hairline)}

/* ── §7 Workload: two marked states only, and never purple ──────────────
   Purple means selection everywhere else in Life OS. Using it for
   "moderately busy" meant one colour carried two unrelated meanings. */
.cm-cell.load-moderate::before{background:transparent}
.cm-cell.load-busy::before{background:var(--warn);opacity:.55}
.cm-cell.load-overloaded::before{background:var(--danger);opacity:.65}

/* ── §8 Clash indicator: an icon with a count, not a bare number ── */
.cm-flag{display:inline-flex;align-items:center;gap:2px;width:auto;min-width:14px;
  height:14px;padding:0 3px;border-radius:7px;font-size:9.5px;font-weight:700}
.cm-flag svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round}

/* ── §11/§12 Canvas transitions ─────────────────────────────────────────
   Direction is the message: forward slides left, back slides right, mode
   change crossfades in place. Transform and opacity only. */
@keyframes cal-in-left{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes cal-in-right{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes cal-in-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cal-canvas-next{animation:cal-in-left var(--d-slow) var(--e-out) backwards}
.cal-canvas-prev{animation:cal-in-right var(--d-slow) var(--e-out) backwards}
.cal-canvas-mode{animation:cal-in-fade var(--d-base) var(--e-out) backwards}
@media (prefers-reduced-motion:reduce){
  .cal-canvas-next,.cal-canvas-prev,.cal-canvas-mode{animation:none}
}
html[data-motion="reduced"] .cal-canvas-next,
html[data-motion="reduced"] .cal-canvas-prev,
html[data-motion="reduced"] .cal-canvas-mode{animation:none}

/* ── §5 Stable rail ─────────────────────────────────────────────────────
   Calendar is one section, so its rail keeps one shell. Only the middle
   contextual card changes with the mode. */
.rail-ctx{animation:cal-in-fade var(--d-base) var(--e-out) backwards}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:11px}
.rail-head h3{margin:0}
.rail-src-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;
  border-radius:7px;font-size:11px;color:var(--muted);background:var(--surface-2);
  transition:color var(--t-hover)}
.rail-src-btn:hover{color:var(--text-2)}
.rail-src-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.rail-src-dot.is-error{background:var(--danger)}

@media (max-width:900px){
  .cal-head-row{flex-direction:column;align-items:stretch;gap:12px}
  .cal-head-side{justify-content:space-between}
  .cal-modes{flex:1}
  /* `flex:1` on the buttons was dead once the track became a grid, and a dead
     declaration next to a live one is how the next person mis-reads this. The
     grid's own 1fr columns already make them equal. */
  .cal-modes button{padding:0 8px}
  .cal-period-label{min-width:0;flex:1}
  .legend{left:12px!important;right:12px;width:auto}
}

/* ── §17 Schedule a task ── */
.modal-schedule{width:min(560px,calc(100vw - 40px));position:fixed}
.st-mark{width:9px;height:9px;border-radius:2px;background:var(--p-low);flex-shrink:0;
  margin-top:14px}
.st-title{font-size:19px;font-weight:600;margin:0;flex:1}
.st-list{display:flex;flex-direction:column;gap:5px;max-height:210px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.st-list::-webkit-scrollbar{width:8px}
.st-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.st-task{display:flex;flex-direction:column;gap:4px;text-align:left;padding:9px 11px;
  border-radius:9px;background:var(--surface-2);border-left:2.5px solid var(--p-marker,var(--muted));
  transition:background var(--t-hover),box-shadow var(--t-hover)}
.st-task.pri-urgent{--p-marker:var(--p-urgent)}
.st-task.pri-high{--p-marker:var(--p-high)}
.st-task.pri-medium{--p-marker:var(--p-medium)}
.st-task.pri-low{--p-marker:var(--p-low)}
.st-task.pri-someday{--p-marker:var(--p-someday)}
.st-task:hover{background:var(--surface-3)}
.st-task.is-sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.st-task:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(138,93,255,.22)}
.st-task-t{font-size:12.5px;color:var(--text);line-height:1.35}
.st-task-m{display:flex;flex-wrap:wrap;gap:5px}
.st-task-m>span{font-size:10px;color:var(--muted);background:var(--surface);
  border-radius:4px;padding:1px 5px}
.st-pri{text-transform:capitalize}
.st-due{color:var(--p-high-ink)}
.st-durations{display:flex;flex-wrap:wrap;gap:5px}
.st-check{margin-top:6px;padding:9px 11px;border-radius:9px;font-size:11.5px;
  line-height:1.45;color:var(--text-2);
  transition:background var(--t-hover),color var(--t-hover)}
.st-check b{font-weight:600;font-variant-numeric:tabular-nums}
.st-check.is-clear{background:rgba(0,217,163,.07);color:var(--text-2)}
.st-check.has-clash{background:rgba(240,145,61,.09);color:var(--p-high-ink)}
.st-empty{display:flex;flex-direction:column;gap:7px;align-items:flex-start;
  padding:20px 0 8px}
.st-empty-t{font-size:14px;font-weight:600;color:var(--text-2)}
.st-empty-s{font-size:12px;color:var(--muted);line-height:1.5}
.st-empty .btn{margin-top:8px}

/* ── §19 Read-only detail ───────────────────────────────────────────────
   Deliberately unlike the editors: no input shells, no Save. The absence of
   a form is the message that Life OS cannot change this. */
.modal-detail{width:min(560px,calc(100vw - 40px));position:fixed}
.dt-head{display:flex;align-items:flex-start;gap:11px}
.dt-accent{width:4px;align-self:stretch;min-height:30px;border-radius:2px;flex-shrink:0;
  margin-top:2px}
.dt-title{flex:1;margin:0;font-size:20px;font-weight:600;line-height:1.32;color:var(--text)}
.dt-body{padding-top:4px}
.dt-rows{margin:0;display:flex;flex-direction:column;gap:1px}
.dt-row{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--hairline)}
.dt-row:last-child{border-bottom:none}
.dt-row dt{font-size:11.5px;font-weight:600;color:var(--muted)}
.dt-row dd{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.5;
  overflow-wrap:anywhere}
.dt-note{margin:14px 0 0;padding:10px 12px;border-radius:9px;font-size:11.5px;
  line-height:1.5;color:var(--muted);background:var(--surface-2);
  border-left:2px solid var(--border-strong)}
.dt-foot{gap:8px}
.dt-meet{background:rgba(78,143,196,.16);color:var(--p-low-ink);text-decoration:none}
.dt-meet:hover{background:rgba(78,143,196,.26)}
.dt-foot .btn{text-decoration:none;display:inline-flex;align-items:center}

@media (max-width:640px){
  .modal-schedule,.modal-detail{left:0;right:0;bottom:0;top:auto;transform:none;
    width:100%;max-height:92vh;border-radius:20px 20px 0 0}
  .dt-row{grid-template-columns:1fr;gap:3px}
}

/* ── D4.3 §7 Stable rail ── */
.rail-context .rail-head h3{font-size:13px;line-height:1.35}
.rail-sync{font-size:10.5px;color:var(--muted)}
.rail-ctx{display:flex;flex-direction:column;gap:var(--stack-gap,20px)}
.rail-attention .rl-row{width:100%;text-align:left}
.cal-hint{margin-top:10px;font-size:10.5px}

/* ── §23 Sources popover ── */
/* Contents only — see .legend above and the shared shell in the D4.7 block. */
.sources{display:flex;flex-direction:column;gap:11px}
.sources h4{margin:0;font-size:12.5px;font-weight:600;color:var(--text)}

/* ── §9 Agenda uses the width it has ── */
.cal-agenda{max-width:var(--cal-max)}
.ag-day{grid-template-columns:64px 1fr;gap:16px}
.ag-item{padding:10px 14px;min-height:46px;gap:12px}
.ag-title{font-size:13px}
.ag-time{min-width:66px;font-size:12px}
@media (min-width:1200px){
  .ag-meta{max-width:44%;justify-content:flex-end}
  .ag-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
}

/* ── §10 Plan week: weekdays carry the planning, weekends recede ─────────
   Seven equal columns made every day too narrow to read at 1440px. Weekends
   keep a column so nothing is hidden, but at 0.62 the weight of a weekday —
   they hold fewer commitments and are rarely where work gets planned. */
.pl-grid{grid-template-columns:54px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,0.62fr))}
.pl-day.is-weekend .pl-day-head{opacity:.6}
.pl-day.is-weekend .pl-canvas{background:rgba(33,30,44,.6)}
.pl-day.is-weekend.has-events .pl-day-head{opacity:1}
.pl-day.is-weekend.has-events .pl-canvas{background:var(--surface)}
@media (max-width:1100px){
  .pl-grid{grid-template-columns:48px repeat(7,minmax(96px,1fr))}
}

/* Daily capacity in the column head. */
.pl-load{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.pl-load.load-busy{color:var(--warn)}
.pl-load.load-overloaded{color:var(--danger)}
.pl-free-label{position:absolute;left:5px;right:5px;font-size:9.5px;color:var(--muted);
  pointer-events:none;padding-top:2px;opacity:0;transition:opacity var(--t-hover)}
.pl-canvas:hover .pl-free-label{opacity:1}

/* ── D4.4 Reminders in Month and Plan ────────────────────────────────────
   A reminder asks for attention on a date; it does not occupy the day the way
   an event does. Dotted rather than solid carries that without a legend. */
.cm-rem-row{display:flex;align-items:center;gap:5px;min-width:0;width:100%;
  font-size:11px;color:var(--text-2);border-radius:5px;padding:1px 3px;text-align:left;
  border:1px dotted rgba(255,196,77,.42);background:transparent;
  overflow:hidden;white-space:nowrap;
  transition:background var(--t-hover),border-color var(--t-hover)}
.cm-rem-row:hover{background:rgba(255,196,77,.08);border-color:rgba(255,196,77,.7)}
.cm-rem-row.is-overdue{border-color:rgba(255,196,77,.85);color:var(--warn)}
.cm-rem-row b{font-weight:600;color:var(--muted);font-size:10px;
  font-variant-numeric:tabular-nums}
.cm-rem-dot{width:5px;height:5px;border-radius:50%;background:var(--warn);flex-shrink:0}
.cm-rem-rep{font-style:normal;font-size:9.5px;color:var(--muted);flex-shrink:0;margin-left:auto}

/* Plan: date-only reminders sit ABOVE the axis so they cannot eat a free
   window that is genuinely still free. */
.pl-rem-ad{display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  font-size:10px;border-radius:5px;padding:2px 6px;color:var(--text-2);
  border:1px dotted rgba(255,196,77,.45);background:transparent;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  transition:background var(--t-hover)}
.pl-rem-ad:hover{background:rgba(255,196,77,.10)}
.pl-rem-ad.is-overdue{border-color:var(--warn);color:var(--warn)}
.pl-rem-ad>i{width:4px;height:4px;border-radius:50%;background:var(--warn);flex-shrink:0}
.pl-rem-ad>span{overflow:hidden;text-overflow:ellipsis}
/* Timed reminders are markers on the axis, never duration blocks. */
.pl-rem{position:absolute;left:3px;right:3px;display:flex;align-items:center;gap:4px;
  font-size:9.5px;color:var(--warn);z-index:2;pointer-events:auto;
  transform:translateY(-50%);text-align:left}
.pl-rem>i{width:5px;height:5px;border-radius:50%;background:var(--warn);flex-shrink:0;
  box-shadow:0 0 0 2px var(--surface)}
.pl-rem>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--surface);padding:0 3px;border-radius:3px}
.pl-rem:hover>span{color:var(--text)}

/* ══ D4.5 ═══════════════════════════════════════════════════════════════ */

/* §19 Three-zone header: the mode selector is centred on the CANVAS, not
   merely placed after the date controls. Equal side columns are what make the
   centre column actually centred. */
/* minmax(0,1fr), not 1fr: a bare `1fr` refuses to shrink below its content, so
   the wider side column steals from the middle and the mode selector ends up
   off-centre — measured 40px left before this. */
.cal-head-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;gap:16px}
.cal-head-main{min-width:0}
.cal-head-main h1{white-space:nowrap}
.cal-head-main{justify-self:start}
.cal-head-mid{justify-self:center}
.cal-head-side{justify-self:end}
.cal-head-sub{display:flex;align-items:center;justify-content:space-between}

/* §13 The identity row is a link now, not a menu trigger. */
.who-go{margin-left:auto;display:grid;place-items:center;width:18px;height:18px;
  color:var(--muted);opacity:0;transform:translateX(-3px);
  transition:opacity var(--t-hover),transform var(--t-hover)}
.who-go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.who:hover .who-go,.who:focus-visible .who-go{opacity:1;transform:translateX(0)}
.who-chev{display:none}

/* §14 Completed history, at the end of the board where content belongs. */
.today-history{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;
  border-radius:10px;font-size:12.5px;font-weight:500;color:var(--muted);
  background:var(--surface);align-self:flex-start;
  transition:background var(--t-hover),color var(--t-hover)}
.today-history:hover{background:var(--surface-2);color:var(--text-2)}
.set-build{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 8px}

/* §3-§5 The workspace itself. */
/* D4.7: the workspace sits on the Calendar frame too, so leaving Reminders
   does not slide the page sideways. */
.rv{width:auto;max-width:var(--cal-max);margin-left:var(--cal-inset);margin-right:0;
  display:flex;flex-direction:column;gap:18px}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rv-filters{display:flex;gap:5px;flex-wrap:wrap}
.rv-filter{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;
  border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);
  background:var(--surface-2);transition:color var(--t-hover),background var(--t-hover)}
.rv-filter:hover{color:var(--text-2)}
.rv-filter.is-on{background:var(--accent-soft);color:var(--text);font-weight:600}
.rv-count{font-size:10.5px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums}
.rv-filter.is-on .rv-count{color:var(--accent)}

.rv-list{display:flex;flex-direction:column;gap:7px}
.rv-card{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:12px;
  background:var(--surface);border-left:2.5px solid transparent;
  transition:background var(--t-hover),border-color var(--t-hover)}
.rv-card:hover{background:var(--surface-2)}
.rv-card.is-overdue{border-left-color:var(--warn)}
.rv-card.is-paused{opacity:.6}
.rv-card.is-done .rv-title{color:var(--muted);text-decoration:line-through}
.rv-check{width:19px;height:19px;border-radius:6px;border:1.7px solid var(--muted);
  flex-shrink:0;position:relative;
  transition:background var(--t-hover),border-color var(--t-hover)}
.rv-check:hover{border-color:var(--ok)}
.rv-card.is-done .rv-check{background:var(--ok);border-color:var(--ok)}
.rv-card.is-done .rv-check::after{content:"";position:absolute;left:6px;top:2px;
  width:5px;height:10px;border:solid #08221c;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rv-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;text-align:left}
.rv-title{font-size:13.5px;color:var(--text);line-height:1.35}
.rv-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-meta>span{font-size:11px;color:var(--muted)}
/* The RULE leads. The date it next lands on is a consequence of it. */
.rv-rule{color:var(--text-2)!important;font-weight:600}
.rv-next{font-variant-numeric:tabular-nums}
.rv-area{background:var(--surface-2);border-radius:5px;padding:1px 7px}
.rv-status{margin-left:auto}
.rv-card.is-overdue .rv-status{color:var(--warn)!important;font-weight:600}
.rv-actions{display:flex;gap:5px;flex-shrink:0;opacity:0;
  transition:opacity var(--t-hover)}
.rv-card:hover .rv-actions,.rv-card:focus-within .rv-actions{opacity:1}
.rv-act{height:28px;padding:0 11px;border-radius:8px;font-size:11.5px;font-weight:500;
  color:var(--muted);background:var(--surface-2);transition:color var(--t-hover)}
.rv-act:hover{color:var(--text)}
.rv-empty{display:flex;flex-direction:column;gap:6px;padding:56px 0;align-items:center;
  text-align:center}
.rv-empty-t{font-size:15px;font-weight:600;color:var(--text-2)}
.rv-empty-s{font-size:12.5px;color:var(--muted);max-width:340px;line-height:1.55}

@media (max-width:900px){
  .cal-head-row{grid-template-columns:1fr;gap:12px}
  .cal-head-main,.cal-head-mid,.cal-head-side{justify-self:stretch}
  .rv-actions{opacity:1}
  .rv-status{margin-left:0}
}

/* ══ D4.6 ═══════════════════════════════════════════════════════════════ */

/* §4 D4.6 gave Calendar its own 38px filled trigger and Today a 34px bare one,
   with a menu class each. D4.7 replaced all four with .util-btn / .util-menu —
   see the D4.7 block. Only the count badge is still local to the menu items. */
.tm-count{margin-left:auto;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}

/* §5 The Reminders workspace header — no period, no modes, no layers. */
.rv-head-row{grid-template-columns:1fr auto}
.rv-head-left{display:flex;align-items:center;gap:14px;min-width:0}
.rv-head-left h1{margin:0}
.rv-head-right{display:flex;align-items:center;gap:10px}
.rv-back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;
  border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);
  background:var(--surface-2);transition:color var(--t-hover)}
.rv-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.rv-back:hover{color:var(--text)}
/* Shares the Add button's shape deliberately, but not its class — a different
   button wearing `cal-add` is how "is this the Calendar Add control?" starts. */
.rv-new-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px 0 13px;
  border-radius:11px;font-size:13px;font-weight:600;color:#fff;
  background:var(--brand);box-shadow:var(--glow);
  transition:transform var(--d-fast) var(--e-out),box-shadow var(--t-hover)}
.rv-new-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round}
.rv-new-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,77,255,.34)}
.rv-new-btn:active{transform:translateY(0) scale(.98)}
.rv-badge{background:rgba(255,196,77,.14)!important;color:var(--warn)!important;
  border-radius:5px;padding:1px 7px;font-weight:600}

/* D4.6 collapsed the PAGE rail column. D4.7 replaced that: see the frame block
   below. Collapsing the page column changed .main-col's width, so the header
   and the canvas — both centred inside it — slid sideways every time a day was
   selected. The rail now lives inside the Calendar frame instead. */

/* §15 Completed history rows. */
.hist-list{display:flex;flex-direction:column;max-width:760px}
.hist-restore{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface-2);
  border-radius:6px;padding:3px 9px;opacity:0;transition:opacity var(--t-hover),color var(--t-hover)}
.hist-row:hover .hist-restore,.hist-restore:focus-visible{opacity:1}
.hist-restore:hover{color:var(--accent)}
.hist-more{margin-top:16px}

/* ══ D4.7 — HEADER CONSISTENCY, VISUAL CENTRING AND RAIL MOTION ═════════ */

/* ── §2/§3 One header grid, stretched across the frame ──────────────────
   `align-items` is stated HERE, next to the layout it belongs to. The bug it
   replaces: a `align-items:start` left over from the D3 grid header survived
   into D4.2's column flex, where it means "shrink horizontally". Every header
   row sat at max-content (860px measured inside a 1520px header) and hugged the
   left, so the mode selector was 330px left of the canvas centre while being
   perfectly centred INSIDE the row — which is why measuring the row always
   reported zero. Measure the composition, not the box you just centred. */
.cal-head{align-items:stretch}
.cal-head-row{width:100%}

/* ── §8-§11 ONE FIXED COMPOSITION FRAME ─────────────────────────────────
   The frame is the same width for the header and the body, and it does not
   change when the rail opens. Previously the rail was a PAGE column, so opening
   it narrowed .main-col — and since both the header and the canvas were centred
   inside .main-col, both slid sideways. Nothing that belongs to the page (the
   title, the period, the utility control, Add, the layer chips) may move
   because a day was selected. */
:root{--cal-rail-w:320px; --cal-rail-gap:24px; --cal-rail-col:0px}
body.cal-rail-open{--cal-rail-col:calc(var(--cal-rail-w) + var(--cal-rail-gap))}

/* ── The frame is centred on the WINDOW, not on the column ──────────────
   `margin-inline:auto` centres the frame inside .main-col, which begins after
   the sidebar — so the calendar sat 84px right of the middle of the screen and
   left a visibly bigger gap on the left. The eye includes the sidebar in the
   page; the layout did not.

   Derived, not nudged: reconstruct where .main-col's left edge is, work out
   where a window-centred frame would start, and inset by the difference. Every
   term is a token this layout already uses, so it holds at every width, and it
   clamps to zero once the frame no longer fits — a narrow window falls back to
   filling the column.

   `--sbw` is the scrollbar, published by measureScrollbar(): 100vw includes it,
   so without that term a scrolling page sits half a scrollbar off centre. */
:root{--sbw:0px}
body:has(.cal-head){
  --cal-win:calc(100vw - var(--sbw));
  --cal-wrap-offset:max(0px, calc((var(--cal-win) - var(--sidebar-w) - var(--content-max)) / 2));
  --cal-col-left:calc(var(--sidebar-w) + var(--cal-wrap-offset) + 44px);
  --cal-inset:max(0px, calc((var(--cal-win) - var(--cal-max)) / 2 - var(--cal-col-left)));
}

/* On Calendar the page rail is unused: the calendar owns its own, inside the
   frame, so the frame can stay still while only the canvas gives up width.
   The empty second track and the gutter are KEPT at zero width deliberately —
   dropping them widened .main-col by the gutter and slid the whole composition
   38px right, which reads as a bigger gap on the left. The column the frame
   centres in must stay exactly the width it has been since D4.2. */
body:has(.cal-head) .main-wrap{grid-template-columns:minmax(0,1fr) 0}
body:has(.cal-head) .rail{display:none}

/* width:auto, not 100%: the frame fills what is left after the inset and is
   then capped, so one rule covers both the wide case (capped at --cal-max,
   window-centred) and the narrow case (inset 0, fills the column). */
body:has(.cal-head) .page-head{display:block}
.cal-head,.cal-body{width:auto;max-width:var(--cal-max);
  margin-left:var(--cal-inset);margin-right:0}
.cal-body{display:grid;grid-template-columns:minmax(0,1fr) var(--cal-rail-col);
  align-items:start;
  transition:grid-template-columns var(--d-slow) var(--e-out)}
.cal-canvas{min-width:0}
/* The canvases fill the frame's first column; the frame owns the max-width now,
   so a second cap here would fight it. */
.cal-body .cal-month,.cal-body .cal-agenda,.cal-body .cal-plan{max-width:none;
  margin-inline:0;width:100%}

/* Agenda's day rows start at the same left edge as a Month cell.
   They used to lead with a 64px date column, so the cards began 80px further
   in than every other mode's content while the canvas edges matched — the
   modes looked like they were on different margins. The date is a label above
   its items now rather than a gutter beside them. */
.cal-body .ag-day{grid-template-columns:minmax(0,1fr);gap:5px;padding:6px 0 10px}
.cal-body .ag-date{flex-direction:row;align-items:baseline;gap:7px;
  padding:0 0 1px 2px}
.cal-body .ag-num{font-size:13.5px;font-weight:700;line-height:1.2}
.cal-body .ag-dow{font-size:10.5px}

/* The rail is clipped, not squeezed. Its content keeps a fixed width so nothing
   inside it re-wraps mid-transition — the reflow flicker §10 forbids. */
.cal-rail{min-width:0;overflow:hidden;position:sticky;top:22px}
.cal-rail-in{width:var(--cal-rail-w);margin-left:var(--cal-rail-gap);
  display:flex;flex-direction:column;gap:14px;
  opacity:0;transition:opacity var(--d-base) var(--e-out)}
.cal-body.rail-shown .cal-rail-in{opacity:1}

/* The mode selector does NOT follow the canvas centre.
   It used to translate by half the rail so it stayed centred over the grid,
   which meant selecting a day slid it 172px and Plan week's permanent rail
   left the whole header sitting off to one side of Month and Agenda. The
   header belongs to the page: the rail is content, and content does not move
   the page's controls. It stays on the frame centre in every mode. */
.cal-head-mid{translate:none}

/* One track, three equal buttons.
   The sliding pill is a third of the track and moves in exact thirds, but the
   buttons were content-width — 72 / 74 / 87px — so the highlight never lined
   up with the label inside it. Measured 7.5px off on Agenda, and 9.4px too
   narrow for "Plan week".

   Grid, not `flex:1`: a flex basis of zero makes the columns equal but lets
   them fall below their own labels, and "Plan week" then overflowed its
   padding and sat 5.4px right of its own button — the same bug one level
   down. `1fr` keeps an auto minimum, so every column is as wide as the widest
   label and the pill's arithmetic is simply true. */
.cal-modes{display:grid;grid-template-columns:repeat(var(--mode-n),1fr)}
.cal-modes button{padding:0 12px}

/* Centred between its arrows. The 168px min-width keeps the control from
   twitching as the label changes length, but the text was left-aligned inside
   it — 7px from the left arrow and 70px from the right. */
.cal-period-label{text-align:center}

@media (prefers-reduced-motion:reduce){
  .cal-body,.cal-head-mid,.cal-rail-in{transition:none}
}

/* §20 Below the point where a 320px rail would leave an unusable grid, the rail
   stops taking width and stacks under the canvas. No lateral animation on a
   layout that has no lateral room. */
@media (max-width:1180px){
  body.cal-rail-open{--cal-rail-col:0px}
  .cal-body{grid-template-columns:minmax(0,1fr);transition:none}
  .cal-rail{overflow:visible;position:static;grid-column:1}
  .cal-rail-in{width:auto;margin-left:0;margin-top:20px}
  .cal-head-mid{translate:none}
}

/* ── §4 ONE utility trigger, shared by Today and Calendar ───────────────
   Two near-identical controls in two sizes with two different backgrounds is
   how "is this the same button?" starts. One class, one geometry, one state
   set — used by both pages. */
.util-btn{width:34px;height:34px;border-radius:10px;color:var(--muted);
  background:transparent;display:grid;place-items:center;
  transition:background var(--t-hover),color var(--t-hover),transform var(--d-instant) var(--e-out)}
.util-btn svg{width:18px;height:18px;fill:currentColor}
.util-btn:hover{background:var(--surface-2);color:var(--text-2)}
.util-btn:active{transform:scale(.94)}
.util-btn[aria-expanded="true"]{background:var(--surface-2);color:var(--text)}
.util-btn:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(138,93,255,.55)}

/* §4/§5 One menu, one anchor language: below the trigger, right edges aligned,
   because the trigger sits at the upper-right of the page on both surfaces. */
/* animation:none because .menu carries `rise`, and the shared entrance already
   animates every utility surface. Two stacked entrances left the menu resting
   8px below where the Sources/Key surface opened from the same button. */
.util-menu{min-width:212px;padding:6px;animation:none}
.util-menu button{display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 12px;border-radius:9px;font-size:13px;color:var(--text-2);
  text-align:left;transition:background var(--t-hover),color var(--t-hover)}
.util-menu button:hover{background:var(--surface-3);color:var(--text)}

/* ── §6 ONE contextual surface for Sources and Key ──────────────────────
   Same shell, same anchor, same width, same shadow, same motion. Only the
   content differs, and switching between them replaces the content INSIDE the
   shell rather than closing one box and opening a different-looking one
   somewhere else. */
/* 12px, not the 13px the two old panels used: every popover in the app shares
   .menu's radius, and a surface that is one pixel rounder than the menu it was
   opened from is a difference nobody can name but everybody can see. */
.util-surface{position:fixed;z-index:300;width:308px;max-width:calc(100vw - 24px);
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--e3);padding:14px 15px;overflow:hidden}
.util-surface h4{margin:0;font-size:12.5px;font-weight:600;color:var(--text)}
.us-body{display:flex;flex-direction:column;gap:13px}
/* The surfaces keep their own internal rhythm (.legend, .sources); the SHELL —
   position, width, border, shadow, padding, motion — is shared. */

/* ══ PROJECTS (Phase E2) ════════════════════════════════════════════════
   A LIST at every width, never a card grid. A grid has to become a list on a
   phone, which means designing the same screen twice and letting the two
   disagree. A list is the same object everywhere; only its density changes. */

/* Same frame as Calendar, so switching sections does not move the page.
   .page-head must be a BLOCK here: as a flex container it sizes its child to
   its content, and the header then sits at 555px inside a 1221px frame —
   exactly the bug D4.7 spent a phase finding on Calendar. */
body:has(.pj-head) .page-head{display:block}
.pj-head,.pj-list{width:auto;max-width:var(--cal-max);
  margin-left:var(--cal-inset, auto);margin-right:0}
body:has(.pj-head){
  --cal-win:calc(100vw - var(--sbw));
  --cal-wrap-offset:max(0px, calc((var(--cal-win) - var(--sidebar-w) - var(--content-max)) / 2));
  --cal-col-left:calc(var(--sidebar-w) + var(--cal-wrap-offset) + 44px);
  --cal-inset:max(0px, calc((var(--cal-win) - var(--cal-max)) / 2 - var(--cal-col-left)));
}
body:has(.pj-head) .main-wrap{grid-template-columns:minmax(0,1fr) 0}
/* §17: no rail. Everything the rail would summarise belongs in the list,
   where it can be acted on. */
body:has(.pj-head) .rail{display:none}

.pj-head{display:flex;flex-direction:column;gap:14px}
.pj-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.pj-head-side{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pj-filters{display:flex;gap:5px;flex-wrap:wrap}
.pj-filter{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;
  border-radius:9px;font-size:12.5px;font-weight:500;color:var(--muted);
  background:var(--surface-2);transition:color var(--t-hover),background var(--t-hover)}
.pj-filter:hover{color:var(--text-2)}
.pj-filter.is-on{background:var(--accent-soft);color:var(--text);font-weight:600}
.pj-fcount{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pj-filter.is-on .pj-fcount{color:var(--accent)}

.pj-list{display:flex;flex-direction:column;gap:26px}
.pj-group{display:flex;flex-direction:column;gap:8px}
.pj-group-h{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);margin:0 0 2px;padding-left:11px;position:relative;
  display:flex;align-items:center;gap:9px}
.pj-group-rows{display:flex;flex-direction:column;gap:7px}

/* ── Group identity (E2.2) ──────────────────────────────────────────────
   The groups were readable but indistinguishable. Separation comes from a
   3px heading mark plus a barely-there row tint — NOT from recolouring whole
   cards, which would turn a calm list into five competing blocks.

   Every group keeps its text label. Colour is a second cue, never the meaning,
   and the semantics are the app's existing ones: purple is the primary
   identity, amber is attention, green is only ever completion. */
.pj-group-h::before{content:"";position:absolute;left:0;top:50%;translate:0 -50%;
  width:3px;height:12px;border-radius:2px;background:var(--muted)}
.pj-group[data-group="attention"] .pj-group-h{color:var(--warn)}
.pj-group[data-group="attention"] .pj-group-h::before{background:var(--warn)}
.pj-group[data-group="now"] .pj-group-h{color:var(--label)}
.pj-group[data-group="now"] .pj-group-h::before{background:var(--accent)}
/* Cool and quieter — available, but not the working set. */
.pj-group[data-group="upcoming"] .pj-group-h::before{background:var(--p-low)}
.pj-group[data-group="on_hold"] .pj-group-h{color:var(--muted)}
.pj-group[data-group="on_hold"] .pj-group-h::before{background:var(--muted)}
.pj-group[data-group="recent"] .pj-group-h{color:var(--muted)}
.pj-group[data-group="recent"] .pj-group-h::before{background:var(--ok)}

/* A tint you should not consciously notice — enough to bind a group's rows
   together, far too little to read as a coloured card. */
.pj-group[data-group="attention"] .pj-row{background:
  linear-gradient(0deg, rgba(255,196,77,.05), rgba(255,196,77,.05)), var(--surface)}
.pj-group[data-group="attention"] .pj-row:hover{background:
  linear-gradient(0deg, rgba(255,196,77,.07), rgba(255,196,77,.07)), var(--surface-2)}
.pj-group[data-group="now"] .pj-row{background:
  linear-gradient(0deg, rgba(138,93,255,.045), rgba(138,93,255,.045)), var(--surface)}
.pj-group[data-group="now"] .pj-row:hover{background:
  linear-gradient(0deg, rgba(138,93,255,.07), rgba(138,93,255,.07)), var(--surface-2)}
/* On hold and Recently completed are secondary, not disabled: full contrast
   text, just no tint pulling the eye towards them. */
.pj-group[data-group="on_hold"] .pj-row,
.pj-group[data-group="recent"] .pj-row{background:var(--surface)}

/* Section rhythm: groups breathe apart, rows inside one stay together. */
.pj-list{gap:30px}
.pj-group[data-group="on_hold"],.pj-group[data-group="recent"]{margin-top:4px}

/* ── The row (E2.1) ─────────────────────────────────────────────────────
   The overview read as a stack of near-identical dark rectangles. The fix is
   HIERARCHY, not colour: one clearly dominant title, a next action that reads
   as the actionable line, a quieter outcome, and state pushed to a footer at a
   smaller size. No hover lift, no tilt, no shadow bloom — the row is a row. */
.pj-row{display:flex;align-items:flex-start;gap:14px;padding:16px 18px 14px;
  border-radius:12px;background:var(--surface);
  border-left:2.5px solid transparent;
  transition:background var(--t-hover),border-color var(--t-hover)}
.pj-row:hover{background:var(--surface-2)}
.pj-row:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(138,93,255,.55)}
.pj-row.is-attention{border-left-color:var(--warn)}
.pj-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}

.pj-title-row{margin:0;display:flex;align-items:center;gap:9px;min-width:0}
/* The one clearly dominant element in the row. */
.pj-title{font-size:16px;font-weight:650;letter-spacing:-.15px;color:var(--text);
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  transition:color var(--t-hover)}
.pj-title:hover{color:var(--accent)}

/* The actionable line — brighter than the outcome, because it is what the row
   is for. */
.pj-next{margin:0;display:flex;align-items:baseline;gap:8px;min-width:0}
.pj-next-lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);flex-shrink:0}
.pj-next-t{font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pj-next-none{font-size:12.5px;color:var(--muted)}

/* ONE attention line: label, reason, action. Never a badge and a sentence
   saying the same thing in the same row. */
.pj-attention{margin:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;min-width:0}
.pj-attention-l{font-size:11px;font-weight:700;color:var(--warn);
  background:rgba(255,196,77,.14);border-radius:5px;padding:2px 7px;white-space:nowrap}
.pj-attention-w{font-size:12.5px;color:var(--text-2);min-width:0}
.pj-attention-act{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.pj-attention-act:hover{text-decoration:underline}

.pj-outcome{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* State, at the bottom and at a smaller size, so it never competes. Progress
   leads it — the number was previously at the far edge and easy to miss. */
.pj-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.pj-progress{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;
  white-space:nowrap}
/* A supporting bar, not the message. The words carry the meaning. */
.pj-bar{width:52px;height:3px;border-radius:2px;background:var(--surface-3);
  overflow:hidden;flex-shrink:0}
.pj-bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pj-area,.pj-state,.pj-focus,.pj-target{font-size:10.5px;border-radius:5px;padding:2px 7px;
  background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pj-row:hover .pj-area,.pj-row:hover .pj-state,
.pj-row:hover .pj-focus,.pj-row:hover .pj-target{background:var(--surface-3)}
.pj-state{color:var(--text-2)}
.pj-focus{background:var(--accent-soft);color:var(--accent)}
.pj-target.is-late{color:var(--warn)}
.pj-more{width:30px;height:30px;flex-shrink:0;margin-top:2px}
.pj-row .pj-more{opacity:0;transition:opacity var(--t-hover)}
.pj-row:hover .pj-more,.pj-row:focus-within .pj-more{opacity:1}

/* A new or restored row is briefly marked so the eye can find where it landed.
   A highlight, not a celebration. */
@keyframes pj-land{from{background:var(--accent-soft)}to{background:var(--surface)}}
.pj-row.is-new{animation:pj-land 1300ms var(--e-out)}
.pj-row.is-entering{animation:rise var(--d-slow) var(--e-out) backwards}

.pj-skel{height:78px;border-radius:12px;background:linear-gradient(90deg,
  var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);
  background-size:320px 100%;animation:shimmer 1.4s linear infinite;margin-bottom:7px}

.pj-empty{display:flex;flex-direction:column;gap:9px;padding:64px 0;align-items:center;
  text-align:center}
.pj-empty-inline{padding:28px 0}
.pj-empty-t{font-size:15px;font-weight:600;color:var(--text-2)}
.pj-empty-s{font-size:12.5px;color:var(--muted);max-width:430px;line-height:1.6}

/* ── Detail (E2.1) ──────────────────────────────────────────────────────
   The structure was right and the composition was not: three sections floating
   in a lot of space with no relationship to each other. The fix is a tighter
   header block, a section rhythm that repeats, and a next action that is
   compact rather than a large empty rectangle. */
.pjd-head{gap:9px}
.pjd-left{display:flex;align-items:center;gap:14px;min-width:0}
.pjd-left h1{margin:0}
.pjd-outcome{font-size:14.5px;color:var(--text-2);margin:0;line-height:1.5;max-width:68ch}
/* The controls read as one band rather than scattered chips. */
.pjd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;
  border-radius:11px;background:var(--surface)}
.pjd-meta .pj-area{background:var(--surface-2)}
.pjd-sel select{height:28px;border-radius:8px;background:var(--surface-2);color:var(--text-2);
  font-size:11.5px;padding:0 8px;border:none;cursor:pointer}
.pjd-sel select:hover{color:var(--text)}
.pjd-meta .pj-progress{margin-left:auto;font-size:12px}
.pjd-health{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pjd-health-why{font-size:12.5px;color:var(--text-2)}

/* One rhythm for every section, so the page reads as one workspace. */
.pjd-body{display:flex;flex-direction:column;gap:26px;width:auto;
  max-width:var(--cal-max);margin-left:var(--cal-inset, auto);margin-right:0}
.pjd-sec{display:flex;flex-direction:column;gap:9px}
.pjd-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pjd-sec-actions{display:flex;align-items:center;gap:7px}
.pjd-sec-h{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);margin:0;display:flex;align-items:baseline;gap:9px}
.pjd-count{font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--muted)}
/* Says WHY this is the next action, without a permanent lecture. */
.pjd-next-why{font-size:11px;color:var(--muted)}

/* Compact, not a giant empty block. */
.pjd-next{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;
  border-radius:12px;background:var(--surface)}
.pjd-next.is-empty{padding:14px 16px;gap:12px;flex-wrap:wrap}
.pjd-next-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;text-align:left;
  transition:background var(--t-hover)}
.pjd-next-open:hover{background:var(--surface-2)}
.pjd-next-t{font-size:14.5px;color:var(--text);font-weight:500;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pjd-next-meta{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
.pjd-next-due{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pjd-next-pri{font-size:10px;text-transform:capitalize;border-radius:5px;padding:2px 7px;
  background:var(--surface-2);color:var(--muted)}
.pjd-next-pri.pri-urgent{color:var(--p-urgent-ink);background:var(--p-urgent-bg)}
.pjd-next-pri.pri-high{color:var(--p-high-ink);background:var(--p-high-bg)}
.pjd-next-sec .btn-sm{flex-shrink:0;margin-right:6px}

.pjd-tasks{display:flex;flex-direction:column;gap:7px;min-height:8px}
.pjd-tasks.is-empty{min-height:0}
.pjd-done{margin-top:10px}
.pjd-done summary{font-size:12px;color:var(--muted);cursor:pointer;padding:6px 2px;
  list-style:none}
.pjd-done summary::-webkit-details-marker{display:none}
.pjd-done summary::before{content:"▸ ";color:var(--muted)}
.pjd-done[open] summary::before{content:"▾ "}
.pjd-done summary:hover{color:var(--text-2)}
.pjd-tasks-done{margin-top:6px;opacity:.72}

/* Grows with what is in it rather than reserving a large empty block. */
.pjd-notes{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:var(--text);
  resize:vertical;min-height:120px;field-sizing:content;max-height:60vh}
.pjd-notes:focus{outline:none;border-color:var(--border-strong)}
/* The save state is a WORD, never a silent colour, and never a false "Saved". */
.pjd-save{font-size:11.5px;color:var(--muted);transition:color var(--t-hover)}
.pjd-save[data-state="saved"]{color:var(--ok)}
.pjd-save[data-state="error"]{color:var(--danger);cursor:pointer;text-decoration:underline}
.pjd-save[data-state="dirty"]{color:var(--warn)}

/* ── Pick an existing task ── */
.modal-picker{max-width:520px;display:flex;flex-direction:column;max-height:76vh}
.tp-search{padding:0 20px 12px}
.tp-list{overflow-y:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:5px}
.tp-row{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;
  padding:11px 13px;border-radius:10px;transition:background var(--t-hover)}
.tp-row:hover{background:var(--surface-2)}
.tp-row:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(138,93,255,.55)}
.tp-title{font-size:13.5px;color:var(--text)}
.tp-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-bucket,.tp-due{font-size:10.5px;color:var(--muted);background:var(--surface-2);
  border-radius:5px;padding:2px 7px;text-transform:capitalize}
.tp-none{font-size:12.5px;color:var(--muted);padding:20px 6px;text-align:center}
.tp-hint{font-size:12px;color:var(--muted);line-height:1.55;margin:0;padding:0 20px 12px}
.tp-auto{padding:0 14px 10px;border-bottom:1px solid var(--hairline);margin-bottom:10px}
.tp-row-auto .tp-title{color:var(--text-2)}
.tp-auto-why{font-size:11px;color:var(--muted)}
.tp-row.is-current{background:var(--accent-soft)}
.tp-current{font-size:10px;font-weight:600;color:var(--accent);
  background:rgba(138,93,255,.14);border-radius:5px;padding:2px 7px}

/* The project a task belongs to, named. Replaces the "arrives with Projects"
   placeholder that sat in every task editor. */
/* ── Project context on a Today card (E2.3) ─────────────────────────────
   A NAME and a link, never a colour: colour cannot say WHICH project, and a
   task that belongs to one should be able to take you there. It sits in the
   existing meta line, so adding it does not move the title. */
.tm-project{font-size:11px;color:var(--accent);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;transition:color var(--t-hover)}
.tm-project:hover{color:var(--text);text-decoration:underline}
.tm-next{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px}

/* Next action carries what the task row carries. */
.pjd-next-sched,.pjd-next-steps,.pjd-next-bucket{font-size:10.5px;color:var(--muted);
  background:var(--surface-2);border-radius:5px;padding:2px 7px;text-transform:capitalize}

.m-project{display:flex;align-items:center;gap:10px;font-size:11.5px;
  padding:10px 0 2px;border-top:1px solid var(--hairline);margin-top:4px}
.m-project-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted)}
.m-project-name{color:var(--text-2)}

.pm-outcome{min-height:56px}

/* A decision with consequences, asked properly — never a browser confirm(),
   which cannot show the counts the decision turns on or say what each choice
   will do. */
.modal-choice{max-width:440px}
.ch-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0;color:var(--text)}
.ch-body{font-size:13px;color:var(--text-2);line-height:1.6;padding-top:0}
.ch-choices{display:flex;flex-direction:column;gap:8px;padding:16px 20px 20px}
.ch-choice{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  padding:13px 15px;border-radius:11px;background:var(--surface-2);
  transition:background var(--t-hover)}
.ch-choice:hover{background:var(--surface-3)}
.ch-choice:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(138,93,255,.55)}
.ch-choice-l{font-size:13.5px;font-weight:600;color:var(--text)}
.ch-choice-d{font-size:12px;color:var(--muted);line-height:1.45}
.ch-choice.is-danger .ch-choice-l{color:var(--danger)}
.ch-choice.is-quiet{background:transparent}
.ch-choice.is-quiet:hover{background:var(--surface-2)}

/* Undo. Nothing destructive happens without one. */
.undo-bar{position:fixed;left:50%;translate:-50% 0;bottom:calc(var(--composer-h) + 28px);
  z-index:400;display:flex;align-items:center;gap:14px;padding:11px 14px 11px 18px;
  border-radius:12px;background:var(--surface-3);box-shadow:var(--e3);
  font-size:13px;color:var(--text-2)}

@media (max-width:1180px){
  body:has(.pj-head) .main-wrap{grid-template-columns:minmax(0,1fr)}
}
/* Tablet and below: two lines, and every action reachable by touch. */
@media (max-width:900px){
  .pj-head-row{flex-direction:column;align-items:stretch;gap:12px}
  .pj-row{flex-direction:column;gap:10px;padding:14px 15px}
  .pj-side{align-items:flex-start;width:100%;flex-direction:row;justify-content:space-between;
    flex-wrap:wrap;gap:8px}
  .pj-outcome{white-space:normal}
  /* No hover-only affordances on touch. */
  .pj-row .pj-more{opacity:1}
  .pj-more{width:38px;height:38px}
  .pj-filter{height:38px;padding:0 14px}
  /* The heading mark carries the group identity on a phone. No thick coloured
     card borders, and no loss of content width. */
  .pj-list{gap:24px}
  .pj-group-h{padding-left:10px}
  .tp-row{padding:13px}
  .tp-hint{padding:0 16px 12px}
  .pjd-meta{gap:7px}
  .pjd-sel select{height:38px}
}

/* ── Ambient stars ──────────────────────────────────────────────────
   Decorative only: behind everything, never interactive, never in the
   layout. Fixed so it does not repaint on scroll. */
#los-stars{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;
  pointer-events:none;user-select:none}
/* Only the shell needs lifting above the star layer. Listing the fixed
   elements here as well set `position:relative` on them, which silently
   overrode `.modal{position:fixed}` and threw the dialog off centre — every
   one of them already carries its own position and z-index. */
.shell{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#los-stars{display:none}}
html[data-motion="reduced"] #los-stars{display:none}

@media (max-width:1500px){ :root{--gutter:40px} }
@media (max-width:1360px){ :root{--rail-w:320px;--gutter:32px} }

@media (max-width:1180px){
  /* Tablet: the rail moves BELOW the content as a row of cards — Legacy's
     behaviour. It never simply disappears. */
  .main-wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding:28px 28px 140px 28px}
  .rail{position:static;max-height:none;overflow:visible;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .rail-today{grid-column:1/-1}
  .buckets{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){
  .buckets{grid-template-columns:1fr;gap:16px}
  .bucket.future{grid-column:auto}
}
@media (max-width:768px){
  :root{--sidebar-w:0px;--composer-h:58px}
  .shell{grid-template-columns:1fr}
  /* Sidebar becomes a drawer (§11: architected for it from the start). */
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:270px;transform:translateX(-100%);
    transition:transform var(--d-slow) var(--e-out);box-shadow:var(--e3);z-index:120;height:100dvh}
  body.drawer-open .sidebar{transform:none}
  .drawer-scrim{display:block;position:fixed;inset:0;background:rgba(10,8,16,.6);z-index:110;
    opacity:0;pointer-events:none;transition:opacity var(--d-base) var(--e-out)}
  body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}

  .mobile-bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;
    background:rgba(23,21,31,.94);backdrop-filter:blur(12px);padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top))}
  .mobile-bar .m-btn{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
    color:var(--text-2);transition:background var(--t-hover)}
  .mobile-bar .m-btn:hover{background:rgba(255,255,255,.06)}
  .mobile-bar .m-title{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:500}

  .main-wrap{padding:16px 16px calc(150px + env(safe-area-inset-bottom));gap:22px}
  .main-col{gap:20px}
  h1{font-size:25px;letter-spacing:-.6px}
  .rail{grid-template-columns:1fr}
  .composer{left:0;right:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
  .hist-row{grid-template-columns:18px 1fr;row-gap:4px}
  .hist-meta{grid-column:2}
  /* Bottom sheet, not a desktop dialog crushed to 375px. */
  .modal{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:92vh;border-radius:20px 20px 0 0}
  .modal-narrow{width:100%}
  .m-body{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .m-grid{grid-template-columns:1fr}
  .m-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .t-actions{opacity:1}
  .t-btn{width:44px;height:44px}
  .set-row{flex-wrap:wrap}
}

/* The Move button is the ONLY non-drag way to move a task, so it must never
   depend on hover. A tablet that reports `hover: hover` would otherwise hide it. */
@media (hover:none),(pointer:coarse),(max-width:768px){
  .grip{display:none}
  .t-actions{opacity:1}
  .icon-btn{width:44px;height:44px;font-size:16px}
  .task{padding:12px 8px 12px 16px;gap:12px}
  .hist-row{padding:14px 12px;min-height:44px}

  /* Every interactive control gets a 44px minimum. Where making the control
     itself 44px would wreck the layout — a 44px tick would dominate a task
     card, a 44px chip row would not fit — the VISIBLE size is kept and the
     hit area is extended with a transparent overlay instead. */
  .nav a,.cmdk,.who,.chip,.rail-area,.seg button,.btn{min-height:44px}
  .chip{display:inline-flex;align-items:center}
  .seg button{display:grid;place-items:center}
  .mobile-bar .m-btn{flex:0 0 44px}   /* flex was shrinking these to 32px wide */

  /* Small round controls: visible size kept, hit area grown to 44px. A 44px
     tick would dominate a 50px card and a 44px ring would break the rail's
     rhythm, so the finger target is the overlay, not the paint.
     `.tick` is the pre-C4 name and is kept so older surfaces stay covered. */
  .tick,.t-tick,.hb-ring,.hb-add,.m-tick,.m-close{position:relative}
  .tick::after,.t-tick::after,.hb-ring::after,.hb-add::after,
  .m-tick::after,.m-close::after{content:'';position:absolute;top:50%;left:50%;
    width:44px;height:44px;transform:translate(-50%,-50%)}
  .tick{width:24px;height:24px;font-size:14px}

  /* Text buttons stretch to the full row instead of hugging their glyphs. */
  .t-title,.hb-name{position:relative;padding:6px 0}
  .t-title::after,.hb-name::after{content:'';position:absolute;
    top:50%;left:0;right:0;height:44px;transform:translateY(-50%)}
}

/* ═══════════════════════════════════════════════════════════════════════
   LIBRARY (Phase F2)
   The Book's geometry is lifted from docs/library-v2-legacy-book-audit.md,
   which was read from the Legacy source. The A4 ratio, the 6px gutter, the
   28/32/18/58 padding, the 46px margin stripe, the mirrored inset edge and
   the 30px ruled cycle are the book — they are not values to round off.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Paper. Dark, warm, and lighter than the surfaces around it, so a page
     reads as paper on a desk rather than as another panel. A white page in a
     dark application is a searchlight. */
  --paper:#262233; --paper-2:#221E2E;
  --paper-line:rgba(255,255,255,.055);
  --paper-ink:#EDEAF6; --paper-ink-2:#B3AAC6;
  --paper-shadow:0 18px 44px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.2);
  /* The six section colours from the audit. */
  --a-peach:#F0A07A; --a-sage:#8CC7A1; --a-lavender:#B69BF0;
  --a-gold:#E8C062;  --a-blue:#79AEE0; --a-rose:#EE8FA8;
}
[data-accent="peach"]{--accent-c:var(--a-peach)}
[data-accent="sage"]{--accent-c:var(--a-sage)}
[data-accent="lavender"]{--accent-c:var(--a-lavender)}
[data-accent="gold"]{--accent-c:var(--a-gold)}
[data-accent="blue"]{--accent-c:var(--a-blue)}
[data-accent="rose"]{--accent-c:var(--a-rose)}

/* Library uses its width for Library. The same mechanism Calendar and
   Projects use — a marker class in the page head, watched by the shell.
   Hiding the rail is not enough on its own: the grid track it sat in has to
   collapse too, or the column keeps the 320px and the book stays narrow. */
body:has(.lib-page) .main-wrap{grid-template-columns:minmax(0,1fr) 0}
body:has(.lib-page) .rail{display:none}

/* ── Overview ─────────────────────────────────────────────────────────── */
.lib-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 22px}
.lib-filters{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.lib-bar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.chip .chip-n{margin-left:6px;font-size:10.5px;font-weight:700;opacity:.6;
  font-variant-numeric:tabular-nums}
.lib-search{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:0 12px;height:var(--btn-h,38px);
  color:var(--muted);transition:border-color var(--t-hover),background var(--t-hover)}
.lib-search:focus-within{border-color:var(--accent);background:var(--surface-2)}
.lib-search input{background:none;border:0;outline:0;color:var(--text);font-size:13px;
  width:150px;min-width:0;font-family:inherit}
.lib-search input::placeholder{color:var(--muted)}
.btn.on{background:var(--accent-soft);color:#fff}

.lib-sec{margin:0 0 30px}
.lib-sec-h{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px}
.lib-grid{display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.lib-skel{height:154px;border-radius:16px}

.lib-card{position:relative;background:var(--surface);border-radius:16px;
  padding:15px 16px 13px 20px;box-shadow:var(--e2);cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;gap:7px;min-height:150px;
  border:1px solid transparent;
  transition:transform var(--t-hover),box-shadow var(--t-hover),border-color var(--t-hover)}
.lib-card:hover{transform:translateY(-2px);box-shadow:var(--e3);border-color:var(--border)}
.lib-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* The spine. A shelf of books should look like one. */
.lib-spine{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a-lavender);
  opacity:.75}
.lib-card[data-type="book"] .lib-spine{background:var(--a-peach)}
.lib-card[data-type="document"] .lib-spine{background:var(--a-blue)}
.lib-card[data-type="link"] .lib-spine{background:var(--a-sage)}
.lib-card[data-type="image"] .lib-spine{background:var(--a-rose)}
.lib-card[data-type="video"] .lib-spine{background:var(--a-gold)}
.lib-card[data-type="file"] .lib-spine{background:var(--muted)}
.lib-card.is-archived{opacity:.62}
.lib-card.is-archived .lib-spine{opacity:.3}

.lib-card-top{display:flex;align-items:center;gap:8px}
.lib-card-icon{color:var(--text-2);display:flex}
.lib-card-type{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted)}
.lib-card-arch{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px}
.lib-card-more{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;
  border-radius:8px;width:26px;height:26px;display:grid;place-items:center;
  opacity:0;transition:opacity var(--t-hover),background var(--t-hover),color var(--t-hover)}
.lib-card:hover .lib-card-more,.lib-card:focus-within .lib-card-more{opacity:1}
.lib-card-more:hover{background:var(--surface-2);color:var(--text)}
.lib-card-more:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:1px}
.lib-card-title{font-size:15px;font-weight:600;color:var(--text);margin:0;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-card-desc{font-size:12.5px;color:var(--text-2);margin:0;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--muted);padding-top:6px}
.lib-card-when{margin-left:auto;font-variant-numeric:tabular-nums}

/* Page matches — the half of a Library search that lives inside a book. */
.lib-hits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lib-hit{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  background:var(--surface);border:1px solid transparent;border-radius:12px;padding:11px 14px;
  cursor:pointer;font-family:inherit;
  transition:background var(--t-hover),border-color var(--t-hover),transform var(--t-hover)}
.lib-hit:hover{background:var(--surface-2);border-color:var(--border);transform:translateY(-1px)}
.lib-hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lib-hit-where{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted)}
.lib-hit-text{font-size:13px;color:var(--text-2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.lib-empty{max-width:560px;margin:40px auto}
.lib-empty-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}

/* Menus — the app's surface language, not a native context menu. */
.lib-menu{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--e3);padding:6px;min-width:230px;display:flex;flex-direction:column;gap:2px}
.lib-menu button{display:flex;align-items:center;gap:11px;background:none;border:0;
  border-radius:9px;padding:9px 11px;text-align:left;color:var(--text);font-size:13px;
  cursor:pointer;font-family:inherit;width:100%;transition:background var(--t-hover)}
.lib-menu button:hover{background:var(--surface-3)}
.lib-menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lib-menu-i{color:var(--text-2);display:flex}
.lib-menu b{display:block;font-weight:600}
.lib-menu small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.lib-menu-sm{min-width:172px}

/* One item — Documents, Links and the record of an upload that does not
   have its bytes yet. Restrained on purpose: there is no viewer to build
   until upload storage exists, and a fake one would be worse than none. */
.lib-item{max-width:720px;background:var(--surface);border-radius:18px;padding:24px 26px;
  box-shadow:var(--e2);display:flex;flex-direction:column;gap:14px}
.lib-item-head{display:flex;align-items:center;gap:10px}
.lib-item-icon{color:var(--text-2);display:flex}
.lib-item-type{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted)}
.lib-item-desc{margin:0;font-size:14.5px;line-height:1.65;color:var(--text-2)}
.lib-item-desc.is-empty{color:var(--muted);font-style:italic}
.lib-item-url{margin:0;font-size:13px;word-break:break-all}
.lib-item-url a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.lib-item-facts{display:flex;flex-wrap:wrap;gap:26px;margin:4px 0 0;
  padding-top:14px;border-top:1px solid var(--border)}
.lib-item-facts dt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 3px}
.lib-item-facts dd{margin:0;font-size:13px;color:var(--text-2)}
.lib-item-note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6;
  background:var(--surface-2);border-radius:10px;padding:11px 13px}

/* The create/rename form. */
.modal-libform .lf-title{font-size:17px;font-weight:600;color:var(--text);margin:0}
.modal-libform .lf-body{display:flex;flex-direction:column;gap:14px}
.lf-hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.lf-area{resize:vertical;min-height:64px;font-family:inherit;line-height:1.55}
.lf-err{margin:0;font-size:12.5px;color:var(--danger)}

/* ── The Book ─────────────────────────────────────────────────────────── */
.bk{display:flex;flex-direction:column;gap:14px;align-items:center}
.bk-stage{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}

/* GEOMETRY — audit §2. Do not adjust these to taste. */
.bk-book{position:relative;display:grid;gap:6px;width:100%;
  aspect-ratio:210/297;max-width:780px;perspective:1600px}
