<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
/* ═══ Life OS v2 — locked design system (design-system.md) ═══ */
:root{
  --app-bg:linear-gradient(180deg,#1A1624 0%,#141220 52%,#111018 100%);
  --sidebar:#17151F; --rail:#1D1A28;
  --surface:#211E2C; --surface-2:#2A2536; --surface-3:#322C40;
  --hairline:#332E43;
  --text:#F4F2FA; --text-2:#B5ABC9; --muted:#766D8B; --label:#CEC7E8;
  --accent:#8A5DFF; --brand:linear-gradient(180deg,#7C4DFF 0%,#C28DFF 100%);
  --name-grad:linear-gradient(180deg,#C89BFF 0%,#8A5DFF 100%);
  --ok:#00D9A3; --danger:#FF646E;
  --e1:0 2px 8px rgba(0,0,0,.14); --e2:0 8px 24px rgba(0,0,0,.22); --e3:0 14px 34px rgba(0,0,0,.32);
  --glow:0 6px 18px rgba(124,77,255,.22);
  --d-fast:140ms; --d-base:200ms; --d-slow:260ms;
  --e-out:cubic-bezier(.2,.7,.2,1); --e-inout:cubic-bezier(.4,0,.2,1);
  --sidebar-w:232px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--app-bg);background-attachment:fixed;color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid rgba(138,93,255,.75);outline-offset:2px;border-radius:8px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* fill-mode is `backwards`, never `both`. `both` keeps the final keyframe applied
   forever, and an animation's applied value outranks a normal declaration — so
   `to{opacity:1}` would permanently beat `.task.done{opacity:.55}` and completed
   tasks would stop looking dim. `backwards` still hides the element during any
   delay, then hands control back to the stylesheet once it finishes. */
.rise{animation:rise var(--d-slow) var(--e-out) backwards}
.stagger>*{animation:rise var(--d-slow) var(--e-out) backwards;animation-delay:calc(var(--i,0)*30ms)}

/* ── Shell ── */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}
.logo svg{filter:drop-shadow(0 0 5px rgba(124,77,255,.28))}
.logo-word{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:500;letter-spacing:-.2px}
.nav{display:flex;flex-direction:column;gap:5px;position:relative;flex:1}
.nav a{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:12px;padding:11px 12px;
  border-radius:10px;font-size:13.5px;font-weight:450;color:#9189A7;text-decoration:none;
  transition:color var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out);position:relative;z-index:1}
.nav a:hover{background:rgba(255,255,255,.045);color:#EAE6F4}
.nav a.active{background:var(--brand);color:#fff;font-weight:600;
  box-shadow:0 6px 18px -6px rgba(124,77,255,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.nav a[aria-disabled]{opacity:.42;pointer-events:none}
.nav-soon{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:auto}
.side-foot{font-size:11px;color:var(--muted);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot button{color:var(--text-2);font-size:12px;text-align:left;padding:6px 0}

.main{padding:32px 32px 120px 44px;max-width:1500px;width:100%}
.page-head{margin-bottom:28px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.06;margin:0 0 6px;color:#F6F3FF}
h1 .nm{background:var(--name-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;color:var(--text-2);margin:0}
.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 20px;flex-wrap:wrap}
.btn{background:var(--surface-2);border-radius:10px;padding:9px 14px;font-size:13px;color:#fff;
  transition:transform var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out),box-shadow var(--d-fast) var(--e-out)}
.btn:hover{background:var(--surface-3);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);font-weight:600;box-shadow:var(--glow)}
.btn-primary:hover{background:linear-gradient(180deg,#9163FF,#D09CFF);transform:translateY(-2px)}
.btn-ghost{background:none;color:var(--text-2)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.chip{background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--text-2)}
.chip.on{background:rgba(138,93,255,.2);color:#fff}

/* ── Buckets: independent workspaces, not table cells ── */
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start;margin-bottom:20px}
.bucket{background:var(--surface);border-radius:16px;padding:16px 14px 14px;box-shadow:var(--e2)}
.bucket.future{grid-column:1/-1}
.bucket-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-left:2px}
.bucket-head h2{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--label);margin:0}
.bucket-count{font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 7px}
.drop{min-height:52px;display:flex;flex-direction:column;gap:8px;border-radius:12px;transition:background var(--d-fast) var(--e-out)}
.drop.over{background:rgba(138,93,255,.09);outline:2px dashed rgba(138,93,255,.45);outline-offset:3px}
.empty{color:var(--muted);font-size:12.5px;padding:16px 10px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--text-2);font-weight:500;margin-bottom:3px}

/* ── Task card ── */
.task{background:#282431;border-radius:12px;padding:11px 12px 11px 16px;position:relative;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.14);display:flex;align-items:flex-start;gap:10px;
  transition:transform var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out),box-shadow var(--d-fast) var(--e-out)}
.task:hover{background:#343040;transform:translateY(-2px);box-shadow:var(--e2)}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe,#5b546e)}
.task.p-urgent{--stripe:#FF646E;box-shadow:inset 0 0 0 1.5px #FF646E,0 0 18px -7px rgba(255,100,110,.55)}
.task.p-high{--stripe:#FF8A5D}.task.p-medium{--stripe:#FFC44D}
.task.p-low{--stripe:#6E86C0}.task.p-someday{--stripe:#6f6878}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.task.dragging{opacity:.55}
.tick{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--muted);background:none;flex-shrink:0;
  display:grid;place-items:center;font-size:11px;color:transparent;margin-top:1px;
  transition:all var(--d-fast) var(--e-out)}
.tick:hover{border-color:var(--ok)}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#08221c}
.t-body{flex:1;min-width:0}
.t-title{font-size:13px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.t-meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:10.5px;color:var(--muted)}
.t-area{background:var(--surface);border-radius:6px;padding:1px 7px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-steps{color:var(--muted)}
.t-actions{display:flex;gap:2px;opacity:0;transition:opacity var(--d-fast) var(--e-out)}
.task:hover .t-actions,.task:focus-within .t-actions{opacity:1}
.icon-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:13px;
  transition:background var(--d-fast) var(--e-out),color var(--d-fast) var(--e-out)}
.icon-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.grip{cursor:grab;color:var(--muted);font-size:12px;opacity:0;transition:opacity var(--d-fast)}
.task:hover .grip{opacity:.6}
/* The Move button is the only way to move a task without dragging, so it must
   never depend on hover alone. Reveal it whenever the pointer is coarse, the
   device reports no hover, OR the viewport is narrow — a touch device that
   claims `hover: hover` (tablet with a trackpad) would otherwise hide it. */
@media (hover:none),(pointer:coarse),(max-width:768px){
  .grip{display:none}
  .t-actions{opacity:1}
  /* 26px is a fine mouse target and a bad thumb one. 44px is the accessible
     minimum, and with drag unavailable here these buttons are the only route. */
  .icon-btn{width:44px;height:44px;font-size:16px}
  .tick{width:24px;height:24px;font-size:13px}
}

/* ── Move menu (the non-drag path) ── */
.menu{position:fixed;z-index:200;background:var(--surface-2);border-radius:12px;padding:6px;box-shadow:var(--e3);
  min-width:190px;animation:rise var(--d-base) var(--e-out) backwards}
.menu-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:7px 10px 5px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;
  color:var(--text-2);text-align:left;transition:background var(--d-fast) var(--e-out),color var(--d-fast) var(--e-out)}
.menu button:hover,.menu button.sel{background:rgba(138,93,255,.18);color:#fff}
.menu button[disabled]{opacity:.4;pointer-events:none}
.menu kbd{margin-left:auto;font-size:10px;color:var(--muted);font-family:inherit}

/* ── Detail panel ── */
.scrim{position:fixed;inset:0;background:rgba(10,8,16,.6);z-index:150;animation:fade var(--d-base) var(--e-out) backwards}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--rail);z-index:151;
  padding:26px 24px;overflow-y:auto;box-shadow:var(--e3);
  animation:slidein var(--d-slow) var(--e-out) backwards}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);margin:0 0 14px;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.input,.ta,.sel{width:100%;background:var(--surface);border:1px solid transparent;border-radius:10px;padding:10px 12px;
  font-size:14px;transition:border-color var(--d-fast) var(--e-out),box-shadow var(--d-fast) var(--e-out)}
.input:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,93,255,.15)}
.ta{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:9px;padding:8px 10px;font-size:13px}
.step input[type=checkbox]{accent-color:var(--ok);width:15px;height:15px}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step button{margin-left:auto;color:var(--muted);font-size:13px}
.panel-foot{display:flex;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--hairline)}

/* ── Sign-in + status ── */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--surface);border-radius:18px;padding:34px 32px;max-width:400px;width:100%;box-shadow:var(--e2);text-align:center}
.card h2{margin:14px 0 8px;font-size:22px;font-weight:700}
.card p{color:var(--text-2);font-size:14px;line-height:1.6;margin:0 0 22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);
  border-radius:12px;padding:11px 18px;font-size:13px;box-shadow:var(--e3);z-index:300;animation:rise var(--d-base) var(--e-out) backwards}
.toast.err{color:var(--danger)}
.hidden{display:none!important}

@media (max-width:1024px){.buckets{grid-template-columns:1fr;gap:16px}.bucket.future{grid-column:auto}}
@media (max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;padding:12px 16px;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}.nav a{grid-template-columns:auto;padding:9px 12px}
  .nav a span:not(.nav-soon){display:none}.side-foot{display:none}
  .main{padding:20px 16px 100px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div id="root" class="center"><div class="card"><p>Starting Life OS…</p></div></div>

<script type="module" src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
