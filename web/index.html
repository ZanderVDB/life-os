<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life OS</title>
<meta name="description" content="Your calm home for everything.">
<meta name="theme-color" content="#141220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.v2.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Life OS v2 — application shell
   Locked design system: design-system.md. Purple is the BRAND, not the
   background. Gradient is reserved for the mark, the primary CTA, the
   greeting name and one hero moment per screen.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Canvas & surfaces */
  --app-bg:linear-gradient(180deg,#1A1624 0%,#141220 52%,#111018 100%);
  --sidebar:#17151F; --rail:#1A1824;
  --surface:#211E2C; --surface-2:#2A2536; --surface-3:#322C40;
  --border:#332E43; --border-strong:#3d3652; --hairline:#332E43;
  /* Text */
  --text:#F4F2FA; --text-2:#B5ABC9; --muted:#766D8B; --label:#CEC7E8;
  /* The one accent */
  --accent:#8A5DFF; --accent-soft:rgba(138,93,255,.16);
  --brand:linear-gradient(180deg,#7C4DFF 0%,#C28DFF 100%);
  --name-grad:linear-gradient(180deg,#C89BFF 0%,#8A5DFF 100%);
  /* Status — meaning only */
  --ok:#00D9A3; --warn:#FFC44D; --danger:#FF646E;
  /* ── Priority (Phase C4) ───────────────────────────────────────────────
     Five levels, one token set. Each has a marker colour, a surface tint and
     a label colour, so a card, the Up-next chip and the selector all speak
     with the same voice. Intensity descends deliberately: urgent is loud,
     someday is nearly silent. */
  --p-urgent:#F0566E;  --p-urgent-bg:rgba(240,86,110,.10); --p-urgent-ink:#FF8A9C;
  --p-high:#F0913D;    --p-high-bg:rgba(240,145,61,.09);   --p-high-ink:#FFB36B;
  --p-medium:#7C6BD8;  --p-medium-bg:rgba(124,107,216,.07);--p-medium-ink:#A99BF0;
  --p-low:#4E8FC4;     --p-low-bg:rgba(78,143,196,.06);    --p-low-ink:#87B8E0;
  --p-someday:#6C6484; --p-someday-bg:transparent;         --p-someday-ink:#8D85A6;
  /* Elevation */
  --e1:0 2px 8px rgba(0,0,0,.14); --e2:0 8px 24px rgba(0,0,0,.22);
  --e3:0 14px 34px rgba(0,0,0,.32);
  --glow:0 6px 18px rgba(124,77,255,.22);
  /* Motion (§7) */
  --d-instant:90ms; --d-fast:140ms; --d-base:200ms; --d-slow:260ms; --d-slower:320ms;
  --e-out:cubic-bezier(.2,.7,.2,1); --e-inout:cubic-bezier(.4,0,.2,1);
  --t-hover:var(--d-fast) var(--e-out);
  --t-select:var(--d-base) var(--e-out);
  --t-page:var(--d-slow) var(--e-out);
  /* Layout tokens — Expanded / Compact / Drawer plug in here (§11) */
  /* Ported verbatim from Legacy v244. These numbers ARE the approved design;
     they are not derivable from the design system's principles. */
  --sidebar-w:232px; --rail-w:380px; --gutter:56px; --content-max:2200px;
  --composer-max:1544px; --composer-h:64px;
  --radius:14px; --radius-lg:18px;

  /* ── Fluid scale (Phase C3) ────────────────────────────────────────────
     Laptops are untouched: every clamp() floor is the value that shipped, and
     the growth only begins at 1600px. Above that the interface grows with the
     viewport instead of stranding a laptop-sized app in the middle of a large
     display. Not a zoom — each token is chosen, and line-heights stay put.
     Reference points: 1440 = floor, 1920 = mid, 2560 = ceiling. */
  --fs-body:15px;
  --fs-task:13px;
  --fs-nav:13.5px;
  --fs-h1:34px;
  --fs-rail:12.5px;
  --row-pad-y:11px;
  --btn-h:38px;
  --composer-h:52px;
  --stack-gap:28px;
}
@media (min-width:1600px){
  :root{
    /* 1600 → 2560px maps to the second value in each clamp. */
    --fs-task:clamp(13px, .52vw + 4.7px, 15.5px);
    --fs-nav:clamp(13.5px, .5vw + 5.5px, 16px);
    --fs-h1:clamp(34px, 1.35vw + 12.4px, 46px);
    --fs-rail:clamp(12.5px, .45vw + 5.3px, 14.5px);
    --row-pad-y:clamp(11px, .5vw + 3px, 16px);
    --btn-h:clamp(38px, .55vw + 29.2px, 44px);
    --composer-h:clamp(52px, .9vw + 37.6px, 66px);
    --stack-gap:clamp(28px, 1vw + 12px, 42px);
    --gutter:clamp(56px, 2vw + 24px, 88px);
    --rail-w:clamp(380px, 12vw + 188px, 460px);
  }
}
*{box-sizing:border-box}
/* Reserve the scrollbar always. Without it the gutter appears only on modes
   tall enough to scroll, so Month rendered 15px narrower than Agenda and the
   page twitched sideways when you switched between them. */
html{scrollbar-gutter:stable}
html,body{margin:0;height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--app-bg);background-attachment:fixed;color:var(--text);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:2px solid rgba(138,93,255,.75);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Motion utilities ───────────────────────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes lotusSettle{from{opacity:0;transform:scale(.82) translateY(4px)}to{opacity:1;transform:none}}
@keyframes wordmarkIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-320px 0}100%{background-position:320px 0}}
/* fill-mode is `backwards`, never `both`: `both` keeps the final keyframe
   applied forever, and an animation outranks a normal declaration — so
   `to{opacity:1}` would permanently beat rules like `.task.done{opacity:.55}`. */
.rise{animation:rise var(--d-slow) var(--e-out) backwards}
.stagger>*{animation:rise var(--d-slow) var(--e-out) backwards;animation-delay:calc(var(--i,0)*30ms)}

/* ══ SHELL ══════════════════════════════════════════════════════════════
   Three columns, persistent. Only .main-scroll crossfades between routes —
   the sidebar and rail never redraw (§11: "transitions are continuous"). */
/* Legacy structure: the app is TWO columns. Content and rail form a nested
   grid with a 56px gutter and a 2200px ceiling — flattening this into one
   three-column grid is what produced the dead centre and the detached rail. */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);
  min-height:100vh;min-height:100dvh}
.main-wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);
  gap:var(--gutter);padding:32px 32px 140px 44px;max-width:var(--content-max);
  margin:0 auto;width:100%}
.main-col{min-width:0;display:flex;flex-direction:column;gap:var(--stack-gap)}

/* ── Left sidebar ───────────────────────────────────────────────────── */
.sidebar{background:var(--sidebar);display:flex;flex-direction:column;
  padding:20px 14px 14px;position:sticky;top:0;height:100vh;height:100dvh;z-index:40}
.logo{display:flex;align-items:center;gap:11px;padding:2px 10px 22px;text-decoration:none}
.logo-mark{flex-shrink:0;filter:drop-shadow(0 0 6px rgba(124,77,255,.3))}
.logo-word{font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:500;
  letter-spacing:-.2px;line-height:1;color:#F6F3FF}
.intro .logo-mark{animation:lotusSettle 620ms var(--e-out) backwards}
.intro .logo-word{animation:wordmarkIn 520ms var(--e-out) 180ms backwards}

.cmdk{display:flex;align-items:center;gap:9px;width:100%;background:rgba(255,255,255,.045);
  border-radius:10px;padding:9px 11px;margin-bottom:16px;color:var(--muted);font-size:13px;
  transition:background var(--t-hover),color var(--t-hover)}
.cmdk:hover{background:rgba(255,255,255,.075);color:var(--text-2)}
.cmdk kbd{margin-left:auto;font-family:inherit;font-size:10.5px;letter-spacing:.04em;
  background:rgba(255,255,255,.07);border-radius:5px;padding:2px 6px;color:var(--muted)}

.nav{position:relative;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
/* THE sliding indicator: one element, translateY only, GPU-composited.
   It never disappears — it snaps on first reveal and glides thereafter. */
/* Legacy's indicator has its OWN gradient (#7C4DFF→#9A67FF), not the button
   gradient, and a fixed 44px height rather than the item's own. */
.nav-pill{position:absolute;left:0;right:0;height:44px;border-radius:10px;
  background:linear-gradient(180deg,#7C4DFF 0%,#9A67FF 100%);
  box-shadow:0 6px 18px -6px rgba(124,77,255,.5),
  inset 0 1px 0 rgba(255,255,255,.12);
  transform:translate3d(0,var(--pill-y,0px),0);will-change:transform;
  transition:transform var(--t-select);pointer-events:none;z-index:0}
.nav-pill.snap{transition:none}
.nav a{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:13px;
  min-height:44px;padding:0 12px;border-radius:10px;font-size:var(--fs-nav);font-weight:450;color:#9189A7;
  text-decoration:none;position:relative;z-index:1;
  transition:color var(--t-hover),transform var(--t-hover)}
.nav a .ico{display:grid;place-items:center;transition:transform var(--t-hover),opacity var(--t-hover)}
.nav a:hover{color:#EAE6F4}
.nav a:hover .ico{transform:translateX(1px);opacity:1}
.nav a[aria-current="page"]{color:#fff;font-weight:600}   /* weight, not brightness */
/* Unfinished sections get ONE quiet dot, not five repetitions of the word
   "soon". The nav should read as a map of the app, not a list of apologies. */
.nav a .soon{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.45;
  font-size:0;line-height:0;overflow:hidden;justify-self:end;margin-right:3px}
.nav a:hover .soon{opacity:.7}
.nav a[aria-current="page"] .soon{background:rgba(255,255,255,.55);opacity:.8}

.side-foot{padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.05);margin-top:8px}
.who{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;
  text-decoration:none;transition:background var(--t-hover)}
.who:hover{background:rgba(255,255,255,.045)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);display:grid;
  place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.who-text{min-width:0}
.who-name{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-sub{font-size:10.5px;color:var(--muted)}

/* ── Main column ────────────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh;min-height:100dvh}
/* Legacy's header is a baseline-aligned ROW with actions pushed right. */
.page-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;flex-basis:100%}
h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-1px;line-height:1.06;margin:0;color:#F6F3FF}
h1 .nm{background:var(--name-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:var(--muted);margin:0}
.main-scroll{min-width:0;animation:fade var(--t-page) backwards}
.toolbar{display:flex;gap:9px;align-items:center;margin:0 0 20px;flex-wrap:wrap}

/* ── Right rail ─────────────────────────────────────────────────────── */
/* Legacy's rail is a sticky COLUMN inside the content grid — not a full-height
   panel welded to the viewport edge. It shares the page canvas. */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:22px;
  align-self:start;max-height:calc(100vh - 60px);overflow-y:auto;padding-right:2px;z-index:30}
.rail-card{background:var(--surface);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--e2)}
.rail-card h3{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);margin:0 0 13px;display:flex;align-items:center;gap:8px}

/* Date is supporting context now, not a card competing for the top slot. */
.rail-when{display:flex;align-items:baseline;gap:8px;padding:0 3px 2px}
.rw-day{font-size:calc(var(--fs-rail) + 1px);font-weight:600;color:var(--text-2)}
.rw-date{font-size:var(--fs-rail);color:var(--muted)}
.un-legacy{font-size:10.5px;color:var(--muted);background:var(--surface-2);
  border-radius:6px;padding:2px 8px;font-style:italic}

/* Habits — green means completed, and nothing else in the app uses it. */
.hb-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border-radius:6px;padding:1px 7px;letter-spacing:0}
.hb-list{display:flex;flex-direction:column;gap:2px}
.hb-row{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:9px;
  transition:background var(--t-hover)}
.hb-row:hover{background:rgba(255,255,255,.035)}
.hb-name{flex:1;min-width:0;font-size:var(--fs-rail);color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--t-hover)}
.hb-row.is-done .hb-name{color:var(--muted)}
.hb-prog{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hb-streak{font-size:10px;font-weight:700;color:var(--ok);background:rgba(0,217,163,.12);
  border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}


.rail-link{font-size:12px;color:var(--accent);padding:4px 0 0;text-align:left;
  transition:opacity var(--t-hover)}
.rail-link:hover{opacity:.75}
.rail-quiet{font-size:var(--fs-rail);color:var(--muted);margin:0;line-height:1.65}

/* Account menu */
.account-menu{min-width:236px;padding:8px}
.am-head{padding:8px 10px 12px;border-bottom:1px solid var(--hairline);margin-bottom:6px}
.am-name{font-size:13.5px;font-weight:600;color:var(--text)}
.am-mail{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.am-ws{font-size:11px;color:var(--muted);margin-top:5px}
.account-menu button[role="menuitem"]{gap:11px}
.am-sep{height:1px;background:var(--hairline);margin:6px 0}
.am-meta{font-size:10.5px;color:var(--muted);padding:4px 10px 8px;font-variant-numeric:tabular-nums}
.am-danger{color:var(--danger)}
.am-danger:hover{background:rgba(255,100,110,.1)!important;color:var(--danger)!important}
.who-chev{margin-left:auto;color:var(--muted);font-size:11px;flex-shrink:0;
  transition:transform var(--t-hover)}
.who[aria-expanded="true"] .who-chev{transform:rotate(180deg)}
.who{width:100%;text-align:left}

/* ── Global composer (AI location, not yet connected) ───────────────── */
/* Legacy: spans from the sidebar to the RIGHT EDGE (over the rail), capped at
   1544px and centred. Full opacity with a real border — the previous .62 made
   it read as broken rather than as pending. */
.composer{position:fixed;left:var(--sidebar-w);right:0;bottom:0;z-index:50;
  padding:12px 28px env(safe-area-inset-bottom,14px);
  background:linear-gradient(to top,#111018 72%,transparent);pointer-events:none}
.composer-inner{pointer-events:auto;max-width:var(--composer-max);margin:0 auto;
  display:flex;align-items:center;gap:13px;background:#1A1826;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid #3A3450;border-radius:var(--radius);padding:0 12px 0 16px;
  box-shadow:var(--e3);min-height:var(--composer-h);cursor:default;
  transition:border-color var(--t-hover),background var(--t-hover)}
.composer-inner:hover{border-color:#4A4266;background:#1D1B2B}
/* The mark, not a disabled input glyph — it reads as a capability waiting to
   arrive rather than a control that is broken. */
/* A softened accent, expressed as a COLOUR not an opacity — translucency is
   what made the old composer read as a disabled control. */
.composer-inner .ico{color:#9E7BFF;flex-shrink:0;display:grid;place-items:center}
.composer-text{flex:1;font-size:calc(var(--fs-task) + .5px);color:var(--muted);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer-badge{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:#B9A6E8;background:rgba(138,93,255,.14);border-radius:7px;padding:4px 9px;flex-shrink:0}


/* ── Buttons / chips ────────────────────────────────────────────────── */
.btn{background:var(--surface-2);border-radius:10px;padding:0 15px;min-height:var(--btn-h);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:#fff;
  transition:transform var(--t-hover),background var(--t-hover),box-shadow var(--t-hover)}
.btn:hover{background:var(--surface-3);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);font-weight:600;box-shadow:var(--glow)}
.btn-primary:hover{background:linear-gradient(180deg,#9163FF,#D09CFF)}
.btn-ghost{background:none;color:var(--text-2)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-danger{background:none;color:var(--danger)}
.btn-danger:hover{background:rgba(255,100,110,.1)}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{background:var(--surface-2);border-radius:99px;padding:6px 13px;font-size:12px;color:var(--text-2);
  transition:background var(--t-hover),color var(--t-hover)}
.chip:hover{background:var(--surface-3);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:#fff}

/* ── Buckets ────────────────────────────────────────────────────────── */
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;
  margin-bottom:20px;align-items:start}
.bucket{background:var(--surface);border-radius:16px;padding:15px 14px 13px;box-shadow:var(--e2)}
.bucket.future{grid-column:1/-1}
.bucket-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-left:2px}
.bucket-head h2{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--label);margin:0}
.bucket-count{font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.drop{min-height:46px;display:flex;flex-direction:column;gap:7px;border-radius:12px;
  transition:background var(--t-hover)}
.drop.is-empty{border:1.5px dashed var(--border);align-items:center;justify-content:center}
.drop.over{background:var(--accent-soft);outline:2px dashed rgba(138,93,255,.45);outline-offset:3px}
.empty{color:var(--muted);font-size:12px;font-style:italic;padding:13px 4px;
  text-align:center;pointer-events:none;line-height:1.5}

/* ── Task card ──────────────────────────────────────────────────────
   Title and metadata read as ONE unit: the meta line sits directly beneath
   the title, dot-separated, and is omitted entirely when there is nothing to
   say. Actions form a single vertically-centred group on the right. */
/* The card is a COLUMN: the task row, then its steps beneath it.
   The three-column grid moved to `.t-row`, so an expanded step panel sits
   under the whole row rather than becoming a fourth grid cell. */
.task{position:relative;display:block;background:#282431;border-radius:12px;
  padding:10px 10px 10px 16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.16);
  transition:background var(--t-hover),box-shadow var(--t-hover),transform var(--t-hover)}
.t-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:11px}
.task:hover{background:#312D3D;box-shadow:var(--e2)}
.task.dragging{opacity:.45}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--p-marker,var(--p-someday))}

/* Priority. Urgent alone earns an outline — and a soft one, so it reads as
   important rather than as an invalid form field. */
.task.pri-urgent{--p-marker:var(--p-urgent);background:linear-gradient(90deg,var(--p-urgent-bg),transparent 46%),#282431;
  box-shadow:inset 0 0 0 1px rgba(240,86,110,.42),0 1px 3px rgba(0,0,0,.16)}
.task.pri-urgent:hover{box-shadow:inset 0 0 0 1px rgba(240,86,110,.6),var(--e2)}
.task.pri-high{--p-marker:var(--p-high);background:linear-gradient(90deg,var(--p-high-bg),transparent 40%),#282431}
.task.pri-medium{--p-marker:var(--p-medium)}
.task.pri-low{--p-marker:var(--p-low)}
.task.pri-someday{--p-marker:var(--p-someday)}
.task.pri-someday .t-title{color:var(--text-2)}

.t-tick{width:20px;height:20px;flex-shrink:0;border-radius:50%;
  border:1.6px solid var(--muted);background:none;position:relative;
  transition:border-color var(--t-hover),background var(--t-hover),transform var(--d-fast) var(--e-out)}
.t-tick:hover{border-color:var(--ok);transform:scale(1.08)}
.t-tick:active{transform:scale(.92)}
.t-main{min-width:0}
.t-title{display:block;width:100%;text-align:left;font-size:var(--fs-task);line-height:1.4;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color var(--t-hover)}
.t-title:hover{color:#fff}
.t-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-sep{opacity:.45}
.tm-area{color:var(--text-2)}
.tm-due{color:var(--text-2)}
.tm-legacy{font-style:italic;opacity:.85}
.tm-steps.is-all{color:var(--ok)}

/* ── Inline steps ──
   A checklist inside a task, not a list of tasks. Everything here is quieter
   and smaller than the parent row, because a step is subordinate to it. */
.tm-steps{display:inline-flex;align-items:center;gap:3px;border:0;background:none;
  padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:5px}
.tm-steps:hover{color:var(--text-2)}
.tm-steps-caret{width:0;height:0;border-left:3.5px solid transparent;
  border-right:3.5px solid transparent;border-top:4px solid currentColor;
  opacity:.7;transition:rotate var(--t-fast)}
.tm-steps[aria-expanded="true"] .tm-steps-caret{rotate:180deg}

/* ── ONE step control, ONE row grid ──
   Four different controls existed before this: 15px, 16px, 15px and 16.7px,
   each pushing the text column to a different x. The controls were vertically
   centred to the pixel; the raggedness was horizontal. Tokens fix the size in
   one place and the grid fixes the columns, so every row — completed, current,
   locked preview, or an editor row — shares one left edge. */
:root{
  --step-tick:18px;          /* the control, everywhere */
  --step-glyph:11px;         /* the checkmark inside it */
  --step-gap:9px;            /* control to text */
  --step-row-pad:2px;        /* the row's own left padding */
  /* Where step TEXT begins. Everything that is not a step row — the Current
     and Next labels, "N more steps", the ready line, the add field — hangs off
     this one value, so they cannot drift 2px away from the text they belong to.
     Measured: all three step texts start at exactly this x. */
  --step-text:calc(var(--step-row-pad) + var(--step-tick) + var(--step-gap));
}
.step-tick{width:var(--step-tick);height:var(--step-tick);flex-shrink:0;
  border-radius:6px;border:1.5px solid var(--border-strong);background:none;
  display:grid;place-items:center;color:transparent;cursor:pointer;padding:0;
  transition:background var(--t-hover),border-color var(--t-hover),color var(--t-hover)}
.step-tick svg{width:var(--step-glyph);height:var(--step-glyph);display:block}
.step-tick:not([disabled]):hover{border-color:var(--ok)}
/* Completed: a filled control with a CENTRED, legible tick — not a green block
   with a mark hidden in the corner. The glyph is 61% of the box. */
.step-tick.is-done{background:var(--ok);border-color:var(--ok);color:#07231d}
.step-tick[disabled]{cursor:default}
.step-tick[disabled].is-done{opacity:.78}
/* Locked: a dashed outline of the SAME size, so the text column does not move.
   Not a disabled checkbox — this step is not unavailable, it is not yet. */
.step-tick.is-locked{border-style:dashed;border-color:var(--border);
  background:none;cursor:default}

.ts-row{display:grid;grid-template-columns:var(--step-tick) minmax(0,1fr) auto;
  align-items:center;gap:var(--step-gap);
  padding:3px 6px 3px var(--step-row-pad);border-radius:7px;
  transition:background var(--t-hover)}
.ts-row:hover{background:rgba(255,255,255,.035)}
.ts-name{min-width:0;background:none;border:none;font-size:12.5px;
  color:var(--text-2);padding:2px 4px;margin-left:-4px;border-radius:5px;
  font-family:inherit;line-height:1.45}
.ts-name:focus{outline:none;background:var(--surface-2);color:var(--text)}
.ts-row.is-done .ts-name{color:var(--muted);text-decoration:line-through;
  text-decoration-color:var(--border-strong)}
.ts-del{width:24px;height:24px;border:0;background:none;border-radius:6px;
  color:transparent;font-size:15px;line-height:1;cursor:pointer;padding:0;
  display:grid;place-items:center;transition:background var(--t-hover),color var(--t-hover)}
.ts-row:hover .ts-del,.ts-del:focus-visible{color:var(--muted)}
.ts-del:hover{background:rgba(255,100,110,.12);color:var(--danger)}
.ts-trail-spacer{width:24px;height:1px}

.t-steps{margin:8px 0 2px 31px;display:flex;flex-direction:column;gap:1px}
.t-steps[hidden]{display:none}
.ts-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}

/* ── Sequence hierarchy ──
   Three levels, and only the middle one is loud: what you did (quiet), what to
   do now (clear), what comes after (a preview). Nothing here is bright — a
   step list in four colours reads as an alert, not as guidance. */
.ts-group{display:flex;flex-direction:column;gap:2px;margin-top:7px}
.ts-label{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding-left:var(--step-text)}
.ts-group-current .ts-label{color:var(--accent)}

.ts-done-list .ts-name{color:var(--muted)}
.ts-done-list .ts-row{opacity:.72}
.ts-done-list .ts-row:hover{opacity:1}

/* Current: the only step with any weight to it. The text stays dominant over
   the label above it. */
.ts-current{background:var(--surface)}
.ts-current .ts-name{color:var(--text);font-size:13px;font-weight:500}
.ts-current .step-tick{border-color:var(--accent)}
.ts-current .step-tick:hover{background:rgba(0,217,163,.10)}

.ts-next .ts-name-locked{background:none;border:0;padding:2px 4px;margin-left:-4px;
  text-align:left;font:inherit;font-size:12.5px;color:var(--text-2);cursor:pointer;
  border-radius:5px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ts-next .ts-name-locked:hover{color:var(--text);background:var(--surface)}

/* Aligned to the TEXT column, not the card edge — it is another step, so it
   starts where the step names start. */
.ts-more{align-self:flex-start;margin:6px 0 0 var(--step-text);
  border:0;background:none;padding:2px 0;font-size:11px;color:var(--muted);
  cursor:pointer;border-radius:5px;text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--border-strong)}
.ts-more:hover{color:var(--text-2)}

.ts-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;
  margin:6px 0 0 var(--step-text)}
.ts-new{min-width:0;background:var(--surface);border:1px solid transparent;
  border-radius:7px;padding:5px 8px;font-size:12.5px;color:var(--text);font-family:inherit}
.ts-new::placeholder{color:var(--muted)}
.ts-new:focus{outline:none;border-color:var(--accent);background:var(--surface-2)}
.ts-add-btn{border:0;background:var(--surface-2);color:var(--text-2);border-radius:7px;
  padding:5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;
  transition:background var(--t-hover),color var(--t-hover)}
.ts-add-btn:hover{background:var(--accent-soft);color:var(--text)}

/* Ready to finish. A note, not a trophy. */
.ts-ready{margin:7px 0 0 var(--step-text);font-size:11px;
  color:var(--ok);font-weight:600;letter-spacing:.01em}
.ts-error{margin:6px 0 0 var(--step-text);font-size:11px;
  color:var(--danger)}

/* Ready to finish: the ordinary checkbox, outlined in the success colour. It
   must be the SAME control a task without steps has — reaching the end of the
   sequence hands back the normal way to finish, it does not invent one. */
.task.is-ready .t-tick,.t-tick.is-ready{border-color:var(--ok)}
.t-tick.is-ready:hover{background:rgba(0,217,163,.12)}

/* The parent control while steps remain: a progress ARC, 22px, on the same
   centre line as an ordinary checkbox so the two never appear to jump.
   No number inside it — 7.5px digits in a 20px circle were unreadable, and the
   `1/3 steps` chip in the meta line already carries the count legibly. */
.t-tick.is-blocked{width:22px;height:22px;border:0;border-radius:50%;
  position:relative;cursor:pointer;
  background:conic-gradient(var(--ok) calc(var(--step-frac) * 360deg),
    var(--surface-3) 0)}
.t-tick.is-blocked::after{content:'';position:absolute;inset:3px;border-radius:50%;
  background:#282431;transition:background var(--t-hover)}
.task:hover .t-tick.is-blocked::after{background:#312D3D}
/* A 44px hit area on a 22px control, without changing the layout it sits in. */
.t-tick.is-blocked::before{content:'';position:absolute;inset:-11px;border-radius:50%}
.t-tick.is-blocked:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Collapsed cards say it in words too, so the state does not depend on
   noticing a ring — or on expanding the task to find out. */
.tm-ready{color:var(--ok);font-weight:650}

/* One aligned action group. Every control is the same size, centred on the
   card's vertical axis — nothing floats at the top edge. */
.t-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;
  opacity:0;transition:opacity var(--t-hover)}
.task:hover .t-actions,.task:focus-within .t-actions{opacity:1}
.t-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--muted);transition:background var(--t-hover),color var(--t-hover)}
.t-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.t-grip{width:22px;height:30px;display:grid;place-items:center;color:var(--muted);
  cursor:grab;opacity:.5}
.t-grip:active{cursor:grabbing}

/* The quiet save indicator — silent by default, a whisper when it speaks. */
.save-state{position:fixed;bottom:calc(var(--composer-h) + 34px);left:50%;
  transform:translateX(-50%) translateY(6px);z-index:280;
  background:var(--surface-2);border-radius:99px;padding:6px 15px;font-size:11.5px;
  color:var(--text-2);box-shadow:var(--e2);opacity:0;pointer-events:none;
  transition:opacity var(--d-base) var(--e-out),transform var(--d-base) var(--e-out)}
.save-state.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── History ────────────────────────────────────────────────────────── */
.history{max-width:840px}
.hist-row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--hairline);
  transition:background var(--t-hover)}
.hist-row:last-child{border-bottom:none}
.hist-row:hover{background:rgba(255,255,255,.035)}
.hist-tick{color:var(--ok);font-size:12px;opacity:.75}
.hist-title{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-meta{display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--muted)}
.hist-when.unknown{font-style:italic;opacity:.7}
.hist-end{font-size:12px;color:var(--muted);margin:16px 0 0;padding-left:2px}

/* ── Placeholder pages ──────────────────────────────────────────────── */
.placeholder{max-width:560px;padding:44px 0 0}
.placeholder .ph-ico{width:56px;height:56px;border-radius:16px;background:var(--surface);
  display:grid;place-items:center;color:var(--accent);margin-bottom:22px;box-shadow:var(--e1)}
.placeholder h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:0 0 10px}
.placeholder p{font-size:14px;line-height:1.7;color:var(--text-2);margin:0 0 10px}
.placeholder .ph-note{font-size:12.5px;color:var(--muted);margin-top:20px;padding-top:18px;
  border-top:1px solid var(--hairline);line-height:1.65}

/* ── Settings — ported from Legacy's tabbed .setting-row structure ──── */
.settings{max-width:760px}
.settings-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 20px;padding-bottom:2px}
.stab{border-radius:9px;padding:8px 14px;font-size:12.5px;color:var(--muted);
  transition:background var(--t-hover),color var(--t-hover)}
.stab:hover{background:rgba(255,255,255,.045);color:var(--text-2)}
.stab[aria-selected="true"]{background:var(--accent-soft);color:#fff;font-weight:600}
.settings-panel{display:flex;flex-direction:column;gap:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius)}
.setting-label-wrap{min-width:0}
.setting-label{font-size:13px;font-weight:500;color:var(--text)}
.setting-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
.setting-right{flex-shrink:0;display:flex;align-items:center;gap:8px}
.setting-intro{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0 0 6px;max-width:60ch}
.setting-ok{font-size:12px;font-weight:600;color:var(--ok);background:rgba(0,217,163,.12);
  border-radius:7px;padding:4px 10px}
.setting-pending{font-size:11.5px;color:var(--muted);background:var(--surface-2);
  border-radius:7px;padding:4px 10px}
.setting-help{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 17px;font-size:12.5px;color:var(--text-2);line-height:1.7}
.setting-help b{display:block;color:var(--text);font-size:13px;font-weight:600;margin-bottom:8px}
.setting-help ul{margin:0;padding-left:18px}
.setting-help li{margin-bottom:5px}
.setting-preview{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 17px}
.sp-label{display:block;font-size:9.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.sp-demo{display:flex;align-items:center;gap:9px}
.sp-swatch{width:22px;height:22px;border-radius:7px;flex-shrink:0}
.sp-brand{background:var(--brand)}.sp-surface{background:var(--surface-2)}
.sp-ok{background:var(--ok)}.sp-danger{background:var(--danger)}
.sp-text{font-size:12px;color:var(--muted);margin-left:4px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-shrink:0}
.seg button{padding:6px 13px;border-radius:7px;font-size:12px;color:var(--text-2);
  transition:background var(--t-hover),color var(--t-hover)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:#fff;font-weight:600}

.area-list{display:flex;flex-direction:column;gap:8px}
.area-row{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius)}
.area-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.area-input{flex:1;min-width:0;background:transparent;border:1px solid transparent;
  border-radius:8px;padding:5px 8px;font-size:13.5px;color:var(--text);
  transition:background var(--t-hover),border-color var(--t-hover)}
.area-input:hover{background:rgba(255,255,255,.035)}
.area-input:focus{outline:none;background:var(--surface-2);border-color:var(--accent)}
.area-meta{font-size:11px;color:var(--muted);flex-shrink:0}
.area-lock{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:var(--surface-2);border-radius:6px;padding:3px 8px;flex-shrink:0}
.habit-list{display:flex;flex-direction:column;gap:8px}
.habit-row{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius)}
.habit-dot{width:8px;height:8px;border-radius:50%;background:var(--hc,var(--ok));flex-shrink:0}
.habit-freq{flex:0 0 128px}
.page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.pa-count{font-size:10px;font-weight:700;color:var(--muted);background:var(--surface-2);
  border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.area-add{display:flex;gap:9px;margin-top:12px}
.area-add .input{flex:1}

/* ── Dialog / panel / menu ──────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,8,16,.62);z-index:150;
  animation:fade var(--d-base) var(--e-out) backwards}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--rail);
  z-index:151;padding:26px 24px;overflow-y:auto;box-shadow:var(--e3);
  animation:slidein var(--d-slow) var(--e-out) backwards}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);
  margin:0 0 16px;font-weight:600}
.field{margin-bottom:15px}
.field label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;font-weight:600}
.input,.ta,.sel{width:100%;background:var(--surface);border:1px solid transparent;border-radius:10px;
  padding:10px 12px;font-size:14px;
  transition:border-color var(--t-hover),box-shadow var(--t-hover)}
.input:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(138,93,255,.15)}
.ta{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:9px;
  padding:8px 10px;font-size:13px}
.step input[type=checkbox]{accent-color:var(--ok);width:15px;height:15px}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step button{margin-left:auto;color:var(--muted);font-size:13px}
.panel-foot{display:flex;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--hairline)}
.menu{position:fixed;z-index:200;background:var(--surface-2);border-radius:12px;padding:6px;
  box-shadow:var(--e3);min-width:196px;animation:rise var(--d-base) var(--e-out) backwards}
.menu-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding:7px 10px 5px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  font-size:13px;color:var(--text-2);text-align:left;
  transition:background var(--t-hover),color var(--t-hover)}
.menu button:hover{background:var(--accent-soft);color:#fff}
.menu button[disabled]{opacity:.4;pointer-events:none}
.menu kbd{margin-left:auto;font-size:10px;color:var(--muted);font-family:inherit}

/* ── Loading / error / toast ────────────────────────────────────────── */
.skeleton{background:linear-gradient(90deg,var(--surface) 8%,var(--surface-2) 18%,var(--surface) 28%);
  background-size:640px 100%;animation:shimmer 1.4s linear infinite;border-radius:12px;height:52px;
  margin-bottom:8px}
.spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.state{max-width:460px;padding:40px 0;color:var(--text-2);font-size:14px;line-height:1.7}
.state b{display:block;color:var(--text);font-size:16px;font-weight:600;margin-bottom:8px}
.toast{position:fixed;bottom:calc(var(--composer-h) + 30px);left:50%;transform:translateX(-50%);
  background:var(--surface-2);border-radius:12px;padding:11px 18px;font-size:13px;box-shadow:var(--e3);
  z-index:300;animation:rise var(--d-base) var(--e-out) backwards;max-width:calc(100vw - 32px)}
/* A toast carrying a verb. One action, never two — a message with a menu in it
   is a dialog wearing the wrong clothes. */
.toast.has-action{display:flex;align-items:center;gap:14px;padding-right:8px}
.toast-action{border:0;background:var(--accent-soft);color:var(--text);
  border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:650;cursor:pointer;
  flex-shrink:0;transition:background var(--t-hover)}
.toast-action:hover{background:var(--accent)}
.toast-action:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Today subsection headings ──
   A label between two runs of cards, not a container around either. Quiet
   enough to read as structure rather than as a thing in its own right. */
.sub-head{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:2px 2px 0;margin-top:4px}
.sub-head:first-child{margin-top:0}
/* The gap above PROJECTS is what actually separates the two groups; the label
   names the separation rather than creating it. */
.sub-head[data-sub="projects"]{margin-top:14px}
.drop.is-empty .sub-head{display:none}

/* A project whose metadata could not be loaded. Stated, not hidden — the task
   is still project work and must not be mistaken for standalone. */
.tm-project.is-missing{color:var(--muted);font-style:italic;cursor:default;
  background:none;border:0;padding:0;font-size:inherit}
.toast.err{color:var(--danger)}

/* ── Update prompt (PWA) ────────────────────────────────────────────── */
.updater{position:fixed;bottom:calc(var(--composer-h) + 30px);left:50%;transform:translateX(-50%);
  z-index:310;background:var(--surface-2);border-radius:14px;padding:13px 15px 13px 18px;
  box-shadow:var(--e3);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);
  animation:rise var(--d-slow) var(--e-out) backwards}
.updater .u-text{font-size:13px;line-height:1.5}
.updater .u-text b{display:block;font-weight:600}
.updater .u-text span{color:var(--muted);font-size:11.5px}

/* ── Mobile shell ───────────────────────────────────────────────────── */
.mobile-bar{display:none}
.drawer-scrim{display:none}

/* ── Modal — centred, never a drawer ────────────────────────────────
   A dialog over the board keeps context visible; the old right drawer covered
   the rail and compressed the workspace into an admin form. */
.modal-scrim{position:fixed;inset:0;background:rgba(9,8,14,.66);z-index:200;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
body.modal-open{overflow:hidden}
.modal{position:fixed;z-index:201;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(620px,calc(100vw - 48px));max-height:min(86vh,780px);
  display:flex;flex-direction:column;background:var(--rail);border-radius:18px;
  box-shadow:var(--e3),0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.modal-narrow{width:min(480px,calc(100vw - 48px))}

.m-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 14px;
  border-bottom:1px solid var(--hairline);flex-shrink:0}
.m-title{flex:1;min-width:0;background:none;border:none;resize:none;overflow:hidden;
  font-size:19px;font-weight:600;line-height:1.35;color:var(--text);padding:0;
  font-family:inherit}
.m-title:focus{outline:none}
.m-title::placeholder{color:var(--muted);font-weight:450}
.m-tick{width:24px;height:24px;flex-shrink:0;margin-top:2px;border-radius:50%;
  border:1.8px solid var(--muted);display:grid;place-items:center;color:transparent;
  transition:background var(--t-hover),border-color var(--t-hover),color var(--t-hover)}
.m-tick:hover{border-color:var(--ok)}
.m-tick.is-done{background:var(--ok);border-color:var(--ok);color:#08221c}
.m-close{width:30px;height:30px;flex-shrink:0;border-radius:8px;color:var(--muted);
  font-size:20px;line-height:1;display:grid;place-items:center;
  transition:background var(--t-hover),color var(--t-hover)}
.m-close:hover{background:rgba(255,255,255,.07);color:#fff}

.m-body{padding:18px 20px;overflow-y:auto;flex:1;min-height:0;
  display:flex;flex-direction:column;gap:14px}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.m-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.m-field>span{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
.m-input{width:100%;background:var(--surface);border:1px solid transparent;border-radius:10px;
  padding:9px 11px;font-size:13.5px;color:var(--text);font-family:inherit;
  transition:border-color var(--t-hover),box-shadow var(--t-hover)}
.m-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,93,255,.15)}
.m-notes{min-height:84px;resize:vertical;line-height:1.6}
/* The priority control wears the priority it sets. */
.pri-select[data-pri="urgent"]{color:var(--p-urgent-ink);border-color:rgba(240,86,110,.4)}
.pri-select[data-pri="high"]{color:var(--p-high-ink);border-color:rgba(240,145,61,.34)}
.pri-select[data-pri="medium"]{color:var(--p-medium-ink)}
.pri-select[data-pri="low"]{color:var(--p-low-ink)}
.pri-select[data-pri="someday"]{color:var(--p-someday-ink)}

.m-legacy{display:flex;align-items:center;gap:9px;background:var(--surface);
  border-radius:10px;padding:9px 12px;font-size:12.5px}
.m-legacy-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.m-legacy-value{color:var(--text);font-style:italic}
.m-legacy-note{margin-left:auto;font-size:10.5px;color:var(--muted)}

.m-steps-block{display:flex;flex-direction:column;gap:8px}
.m-steps-head{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.m-steps-count{margin-left:auto;letter-spacing:0;font-size:10px;background:var(--surface);
  border-radius:6px;padding:1px 7px}
/* The editor's step list is the SAME list Today draws: same `.ts-row` grid,
   same `.step-tick`. Only its behaviour differs — every step is tickable here,
   in any order. It used to carry its own 16.7px control and its own spacing,
   which is half of why the two lists never looked like the same thing. */
.m-steps{display:flex;flex-direction:column;gap:4px}
.m-steps .ts-row{background:var(--surface);padding:6px 8px 6px 10px;border-radius:9px}
.m-steps .ts-name{font-size:13px;color:var(--text)}
.m-steps .ts-row.is-done .ts-name{color:var(--muted)}
.m-step-add{margin-left:calc(var(--step-text) + 8px)}
/* The Add button is not decoration. Enter was the only way to commit a step,
   nothing said so, and typing one then clicking Save discarded it silently. */
/* A completed task, opened from history. It is not an ordinary edit and must
   not look like one — the bar says what happened and offers the one verb that
   makes sense next. */
/* The override confirmation. Inside the editor, not over it, so the task you
   are deciding about stays visible behind the question. */
/* FIXED, not absolute-inside-the-modal. `.modal` is `position:fixed` centred by
   a transform, and giving it `position:relative` to contain this silently
   overrode that and threw the dialog 310px off centre — a regression caught
   once already and guarded by test. A fixed overlay needs no containing block,
   and the editor still shows through behind it. */
.m-confirm{position:fixed;inset:0;z-index:210;display:grid;place-items:center;
  background:rgba(12,10,18,.72);padding:20px}
.m-confirm-card{background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:14px;box-shadow:var(--e3);padding:20px 22px;max-width:340px;
  display:flex;flex-direction:column;gap:8px}
.m-confirm-card h3{margin:0;font-size:15px;font-weight:650;color:var(--text)}
.m-confirm-card p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.5}
.m-confirm-acts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.m-confirm-acts .btn{width:100%;justify-content:center;text-align:center}

.m-done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 18px;background:rgba(0,217,163,.07);
  border-bottom:1px solid var(--hairline)}
.m-done-when{font-size:11.5px;color:var(--ok);font-weight:600}
.modal.is-completed .m-title{color:var(--muted)}

.m-step-add{display:flex;gap:8px;align-items:center}
.m-step-add .m-input{font-size:13px;flex:1;min-width:0}
#m-step-add{flex-shrink:0}

.m-soon{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);
  padding-top:2px}
.m-soon-tag{background:var(--surface);border-radius:6px;padding:3px 9px;font-size:10px;
  letter-spacing:.05em;text-transform:uppercase}

.m-foot{display:flex;align-items:center;gap:8px;padding:14px 20px;
  border-top:1px solid var(--hairline);flex-shrink:0}
.m-save-state{margin-left:auto;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.m-danger{color:var(--danger)}
.m-danger:hover{background:rgba(255,100,110,.1)}

/* Habit modal extras */
.h-stats{display:flex;gap:22px}
.h-stat{display:flex;flex-direction:column;gap:2px}
.h-stat .n{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1;
  font-variant-numeric:tabular-nums}
.h-stat .l{font-size:11px;color:var(--muted)}
.h-days.is-hidden{display:none}
.h-day-row{display:flex;gap:5px}
.h-day{width:34px;height:34px;border-radius:9px;background:var(--surface);
  font-size:12px;color:var(--muted);
  transition:background var(--t-hover),color var(--t-hover)}
.h-day:hover{background:var(--surface-2);color:var(--text-2)}
.h-day[aria-pressed="true"]{background:var(--accent-soft);color:#fff;font-weight:600}
.h-recent{display:flex;flex-direction:column;gap:7px}
.h-recent-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
.h-recent-row{display:flex;gap:4px}
.h-dot{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}
.h-dot.is-done{background:var(--ok);opacity:.85}
.h-recent-note{font-size:10.5px;color:var(--muted)}

/* ── Habit ring ─────────────────────────────────────────────────────
   An SVG ring whose stroke carries progress, so a multi-count habit shows
   partial fill instead of an all-or-nothing tick. Green is completion, and
   completion only — it appears nowhere else in the app. */
.hb-add{margin-left:auto;width:24px;height:24px;border-radius:7px;color:var(--muted);
  font-size:17px;line-height:1;display:grid;place-items:center;
  transition:background var(--t-hover),color var(--t-hover)}
.hb-add:hover{background:rgba(255,255,255,.07);color:#fff}
.hb-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border-radius:6px;padding:1px 7px;letter-spacing:0}
.hb-count+.hb-add{margin-left:6px}
.hb-list{display:flex;flex-direction:column;gap:1px}
.hb-row{display:flex;align-items:center;gap:11px;padding:7px 6px;border-radius:10px;
  transition:background var(--t-hover)}
.hb-row:hover{background:rgba(255,255,255,.035)}
.hb-ring{position:relative;width:32px;height:32px;flex-shrink:0;display:grid;
  place-items:center;border-radius:50%}
/* Scoped with `>` and a class. The old rule was `.hb-ring svg`, which also
   matched the check icon nested in .hr-mark and forced it to 32px, absolute,
   inset:0 and rotate(-90deg) — a checkmark blown up 2.5x, stretched across the
   whole control and turned on its side. That was the "arrow tail". */
.hb-ring>svg.hr-svg{position:absolute;inset:0;width:32px;height:32px;
  transform:rotate(-90deg);pointer-events:none}
.hr-track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:2.6}
/* pathLength="100" makes the dash units exact percentages. Hard-coding 2*PI*r
   was wrong: a browser renders <circle> as four Bezier arcs whose real length
   is 81.155, not 81.681, so every partial fill drifted and the seam misjoined.
   `butt` caps, not `round`: a round cap adds half the stroke width past each
   end, overshooting the seam when full and leaving a dot when empty. */
.hr-fill{fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:butt;
  transition:stroke-dashoffset var(--d-slow) var(--e-out),opacity var(--d-fast) linear}
.hr-fill.is-empty{opacity:0}
.hb-ring:hover .hr-track{stroke:rgba(0,217,163,.3)}

/* Centre content: a check when complete, the count while partial, nothing
   otherwise. Sized in its own right so no ancestor rule can stretch it. */
.hr-mark{position:relative;width:14px;height:14px;display:grid;place-items:center;
  color:var(--ok);opacity:0;transform:scale(.6);
  transition:opacity var(--d-fast) var(--e-out),transform var(--d-fast) var(--e-out)}
.hr-mark>svg{width:14px;height:14px;position:static;transform:none}
.hb-row.is-done .hr-mark{opacity:1;transform:scale(1)}
.hr-count{position:relative;font-size:9.5px;font-weight:700;color:var(--ok);
  font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.hb-name{flex:1;min-width:0;text-align:left;font-size:var(--fs-rail);color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color var(--t-hover)}
.hb-name:hover{color:var(--text)}
.hb-row.is-done .hb-name{color:var(--muted)}
.hb-prog{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Beside the name, not pinned to the row's right edge: a badge floating at the
   far side is hard to associate with the habit it belongs to. Zero stays quiet. */
.hb-streak{font-size:10.5px;font-weight:700;color:var(--ok);flex-shrink:0;
  background:rgba(0,217,163,.12);border-radius:5px;padding:1px 5px;
  font-variant-numeric:tabular-nums}
.hb-streak.is-zero{color:var(--muted);background:transparent;padding:1px 0;
  opacity:.55;font-weight:500}
.hs-unit{font-weight:500;opacity:.75;font-size:9px;margin-left:.5px}

/* Completion acknowledgement: the tick fills, then the text softens, then the
   card collapses. Restrained on purpose — no confetti, no particles. */
.task.is-completing{background:linear-gradient(90deg,rgba(0,217,163,.10),transparent 55%),#282431;
  box-shadow:inset 0 0 0 1px rgba(0,217,163,.30)}
.task.is-completing .t-title{color:var(--muted);text-decoration:line-through;
  text-decoration-color:rgba(0,217,163,.55);transition:color var(--d-fast) var(--e-out)}
.task.is-completing .t-meta,.task.is-completing .t-actions{opacity:.35;
  transition:opacity var(--d-fast) var(--e-out)}
.task.is-completing .t-tick{background:var(--ok);border-color:var(--ok);color:#08221c}

/* ── Task dragging ───────────────────────────────────────────────────
   The placeholder IS the proposed position. It is a real element in the real
   layout, so what the user sees during a drag is the future board rather than
   a hint about it. The lifted card keeps its exact size and follows the
   pointer; everything else slides via FLIP. */
.task-placeholder{border-radius:var(--radius);border:1.5px dashed var(--border-strong);
  background:rgba(138,93,255,.05);box-sizing:border-box;
  transition:height var(--d-fast) var(--e-out)}
.task.is-dragging{box-shadow:var(--e3);opacity:.96;cursor:grabbing;
  transform-origin:center;will-change:transform;border-color:var(--accent);
  /* Width and height are animated because the card CHANGES SIZE when it moves
     between buckets of different widths — Future spans the full row. Snapping
     between the two sizes reads as a glitch; easing reads as the card fitting
     itself to where it is going. */
  transition:width var(--d-base) var(--e-out),height var(--d-base) var(--e-out)}
body.is-dragging-task{cursor:grabbing;user-select:none;-webkit-user-select:none}
/* A card is grabbable anywhere that is not a control. */
.task{cursor:grab}
.task:active{cursor:grabbing}
body.is-dragging-task .task:not(.is-dragging){cursor:grabbing}
/* An emptied bucket must keep a target while the pointer is over it. */
.drop.is-empty{min-height:52px}
@media (prefers-reduced-motion:reduce){
  .task-placeholder{transition:none}
}

/* ══ EVENT EDITOR (Phase D3) ═════════════════════════════════════════════
   Every control is custom. The brief named the offenders to avoid — three-part
   date boxes, white checkbox squares, native select arrows, stark white
   date-picker surfaces, mismatched heights, browser-blue focus rings — so
   there is ONE input shell at ONE height, and the date/time pickers are ours. */
.modal-event{width:min(620px,calc(100vw - 40px));max-height:min(86vh,760px);
  display:flex;flex-direction:column;position:fixed}
.ev-head{display:flex;align-items:flex-start;gap:10px}
.ev-src-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:13px;
  transition:background var(--t-hover)}
.ev-body{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.ev-ro-note{margin:0 22px 4px;padding:9px 12px;border-radius:9px;font-size:12px;
  color:var(--text-2);background:var(--surface-2);border-left:2px solid var(--warn)}

.ev-row{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;
  padding:4px 0;min-height:44px}
.ev-row-top{align-items:start}
.ev-row-top .ev-lab{padding-top:11px}
.ev-lab{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.ev-when{display:flex;flex-direction:column;gap:0;padding-bottom:6px;
  border-bottom:1px solid var(--hairline);margin-bottom:8px}

/* One shell, one height — nothing here should look like a different widget. */
.ev-ctl{height:38px;background:var(--surface-2);border:1px solid transparent;
  border-radius:10px;padding:0 12px;font-size:13px;color:var(--text);
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  transition:border-color var(--t-hover),background var(--t-hover)}
.ev-ctl:hover{background:var(--surface-3)}
.ev-ctl:focus-visible{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(138,93,255,.16)}
.ev-input{font:inherit}
.ev-input::placeholder{color:var(--muted)}
.ev-textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.ev-time{width:88px;flex:0 0 88px;justify-content:center;
  font-variant-numeric:tabular-nums;transition:opacity var(--d-fast) var(--e-out),
    width var(--d-fast) var(--e-out),flex-basis var(--d-fast) var(--e-out)}
.ev-time.is-hidden{width:0;flex-basis:0;opacity:0;padding:0;border:none;overflow:hidden}

/* Select: our own chevron, the native arrow removed. */
.ev-select{position:relative;padding-right:34px}
.ev-select select{appearance:none;-webkit-appearance:none;background:none;border:none;
  width:100%;height:100%;font-size:13px;color:var(--text);cursor:pointer}
.ev-select select:focus{outline:none}
.ev-select option{background:var(--surface-2);color:var(--text)}
.ev-chev{position:absolute;right:13px;width:7px;height:7px;pointer-events:none;
  border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);
  transform:rotate(45deg) translateY(-2px)}

/* Switch, not a checkbox square. */
.sw{display:inline-flex;align-items:center;gap:9px;height:38px;background:none;padding:0}
.sw-track{width:38px;height:21px;border-radius:11px;background:var(--surface-3);
  position:relative;transition:background var(--t-select);flex-shrink:0}
.sw-knob{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:transform var(--t-select),background var(--t-select)}
.sw.is-on .sw-track{background:var(--accent-soft)}
.sw.is-on .sw-knob{transform:translateX(17px);background:var(--accent)}
.sw-lab{font-size:12.5px;color:var(--text-2)}

.ev-more{display:inline-flex;align-items:center;gap:9px;height:38px;margin-top:6px;
  font-size:12.5px;font-weight:600;color:var(--text-2);align-self:flex-start;
  transition:color var(--t-hover)}
.ev-more:hover{color:var(--text)}
.ev-more .ev-chev{position:static;transition:transform var(--d-base) var(--e-out)}
.ev-more.is-open .ev-chev{transform:rotate(225deg) translateY(-2px)}
/* Same trap as .hov: `display:flex` beats the UA's `[hidden]{display:none}`,
   so "More options" was permanently expanded despite the hidden attribute
   being set. Progressive disclosure that never disclosed anything. */
.ev-adv[hidden]{display:none}
.ev-adv{display:flex;flex-direction:column;gap:2px;padding-top:6px;
  border-top:1px solid var(--hairline);margin-top:6px}

.ev-guests{display:flex;flex-direction:column;gap:7px}
.ev-chips{display:flex;flex-wrap:wrap;gap:5px}
.ev-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 6px 3px 8px}
.ev-chip i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.rsvp-accepted i{background:var(--ok)}
.rsvp-declined i{background:var(--danger)}
.rsvp-tentative i{background:var(--warn)}
.ev-chip-x{font-size:14px;color:var(--muted);line-height:1;padding:0 2px;
  transition:color var(--t-hover)}
.ev-chip-x:hover{color:var(--text)}
.ev-hint{font-size:11px;color:var(--muted);line-height:1.45}

.ev-notify{display:flex;flex-wrap:wrap;gap:5px}
.ev-pill{height:28px;padding:0 11px;border-radius:8px;font-size:11.5px;font-weight:500;
  background:var(--surface-2);color:var(--muted);
  transition:background var(--t-hover),color var(--t-hover)}
.ev-pill:hover{color:var(--text-2)}
.ev-pill.is-on{background:var(--accent-soft);color:var(--text)}
.ev-seg{height:38px}
.ev-seg button{min-width:66px;font-size:12.5px}

.ev-swatches{display:flex;flex-wrap:wrap;gap:6px}
.ev-swatch{width:26px;height:26px;border-radius:8px;background:var(--sw);
  border:2px solid transparent;font-size:10px;color:var(--muted);
  display:grid;place-items:center;
  transition:transform var(--d-fast) var(--e-out),border-color var(--t-hover)}
.ev-swatch:hover{transform:scale(1.09)}
.ev-swatch.is-sel{border-color:var(--text)}

.ev-meet{display:inline-flex;align-items:center;height:38px;padding:0 14px;
  border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;
  background:rgba(78,143,196,.16);color:var(--p-low-ink);
  transition:background var(--t-hover)}
.ev-meet:hover{background:rgba(78,143,196,.26)}

/* Life OS-only section, visually apart so it is never read as Google content. */
.ev-los{margin-top:12px;padding:12px;border-radius:10px;background:rgba(138,93,255,.05);
  border:1px dashed var(--border-strong);display:flex;flex-direction:column;gap:7px}
.ev-los-lab{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--label)}
.ev-los-list{display:flex;flex-wrap:wrap;gap:5px}

/* ── Custom date picker ── */
.ev-pop{position:absolute;z-index:5;background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--e3);
  padding:10px;animation:rise var(--d-fast) var(--e-out) backwards}
.dp{width:246px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-label{font-size:12.5px;font-weight:600;color:var(--text)}
.dp-nav{width:26px;height:26px;border-radius:7px;color:var(--text-2);font-size:15px;
  display:grid;place-items:center;transition:background var(--t-hover)}
.dp-nav:hover{background:var(--surface-3)}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.dp-dow span{font-size:9.5px;font-weight:600;color:var(--muted);text-align:center}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{height:30px;border-radius:8px;font-size:12px;color:var(--text-2);
  display:grid;place-items:center;
  transition:background var(--t-hover),color var(--t-hover)}
.dp-day:hover{background:var(--surface-3);color:var(--text)}
.dp-day.is-out{opacity:.35}
.dp-day.is-today{color:var(--accent);font-weight:700}
.dp-day.is-sel{background:var(--accent);color:#fff;font-weight:600}

/* ── Custom time picker ── */
.tp{width:120px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.tp::-webkit-scrollbar{width:8px}
.tp::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.tp::-webkit-scrollbar-track{background:transparent}
.tp-opt{height:30px;border-radius:7px;font-size:12px;color:var(--text-2);
  font-variant-numeric:tabular-nums;transition:background var(--t-hover)}
.tp-opt:hover{background:var(--surface-3);color:var(--text)}
.tp-opt.is-sel{background:var(--accent);color:#fff;font-weight:600}

/* Save button progress — restrained, no spinner takeover. */
.btn.is-busy{opacity:.72;pointer-events:none;position:relative}

/* ── Add menu ── */
.cal-menu{min-width:236px;padding:6px}
.cal-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  width:100%;padding:9px 11px;border-radius:9px;text-align:left;
  transition:background var(--t-hover)}
.cal-menu button:hover{background:var(--surface-3)}
.cm-add-l{font-size:13px;color:var(--text);font-weight:500}
.cm-add-h{font-size:11px;color:var(--muted)}

@media (max-width:640px){
  .modal-event{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:92vh;border-radius:20px 20px 0 0}
  .ev-row{grid-template-columns:1fr;gap:5px;padding:7px 0}
  .ev-row .ev-lab{padding-top:0}
  .ev-when{gap:4px}
  .ev-time{width:100%;flex-basis:auto}
  .ev-time.is-hidden{height:0;min-height:0}
  /* 44px minimum on touch. The desktop editor packs controls at 38px, which is
     right for a pointer and too small for a finger. */
  .ev-ctl,.sw,.ev-more,.ev-seg,.ev-meet{min-height:44px}
  .ev-ctl{height:44px}
  .ev-textarea{height:auto;min-height:92px}
  .ev-pill{height:38px;padding:0 14px}
  .ev-swatch{width:38px;height:38px}
  .m-close{width:44px;height:44px}
  /* 7 columns x 44px = 308px, which fits a 375px viewport, so there is no
     reason to compromise the date grid on touch. */
  .dp-day{height:44px}
  .tp-opt{height:44px}
  .ev-chip{min-height:30px}
  .ev-chip-x{min-width:24px;min-height:24px}

  .ev-pop{position:fixed;left:12px!important;right:12px;top:auto!important;bottom:12px;
    width:auto}
  .dp{width:100%}
  .tp{width:100%;max-height:180px}
}

/* ══ CALENDAR (Phase D3) ══════════════════════════════════════════════
   Month, Agenda, Plan. Source-calendar colour appears only INSIDE an event's
   own representation — a small edge or dot — never across the shell. Purple
   stays selection, red stays conflict, green stays completion. */
/* The header's own layout lives in the D4.5/D4.7 blocks below. This rule used
   to set `display:grid;grid-template-columns:1fr auto;align-items:start`; D4.2
   replaced the display but left align-items behind, and in the column flex
   container that replaced it `align-items` governs the HORIZONTAL axis — so
   every header row shrank to max-content and hugged the left of a full-width
   header. That is the entire "header is off-centre" bug. Do not reintroduce a
   default here: state alignment where the header layout is stated. */
.cal-head-main{display:flex;flex-direction:column;gap:8px}
.cal-period{display:flex;align-items:center;gap:6px}
.cal-period-label{font-size:15px;font-weight:600;color:var(--text-2);min-width:150px}
.cal-nav{width:30px;height:30px;border-radius:9px;color:var(--text-2);font-size:18px;
  display:grid;place-items:center;transition:background var(--t-hover),color var(--t-hover)}
.cal-nav:hover{background:var(--surface-2);color:var(--text)}
.cal-today{height:30px;font-size:12.5px}
.cal-head-side{display:flex;align-items:center;gap:10px}
.cal-modes button{min-width:72px}
.cal-layers{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}
.cal-layer{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
  border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);
  background:var(--surface-2);border:1px solid transparent;
  transition:color var(--t-hover),border-color var(--t-hover),background var(--t-hover)}
.cal-layer:hover{color:var(--text-2)}
.cal-layer.is-on{color:var(--text);border-color:var(--border-strong)}
.cl-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cal-layer.is-on .cl-events{background:var(--accent)}
.cal-layer.is-on .cl-reminders{background:var(--warn)}
.cal-layer.is-on .cl-tasks{background:var(--p-low)}
.cal-layer.is-on .cl-habits{background:var(--ok)}

/* ── Month ── */
.cal-month{display:flex;flex-direction:column;gap:8px}
.cm-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 2px}
.cm-dow span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding-left:8px}
.cm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  grid-auto-rows:minmax(112px,auto);gap:6px}
.cm-cell{background:var(--surface);border-radius:12px;padding:7px 8px 6px;
  display:flex;flex-direction:column;gap:5px;min-width:0;cursor:pointer;
  border:1px solid transparent;position:relative;
  transition:background var(--t-hover),border-color var(--t-hover)}
.cm-cell:hover{background:var(--surface-2);border-color:var(--border)}
.cm-cell.is-outside{opacity:.42}
.cm-cell.is-today .cm-num>span{background:var(--accent);color:#fff;border-radius:7px;
  min-width:22px;text-align:center}
.cm-cell.is-selected{border-color:var(--accent);background:var(--accent-soft)}
.cm-num{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
  color:var(--text-2)}
.cm-num>span{padding:1px 5px}
.cm-flag{font-size:11px;font-weight:800;color:var(--danger);margin-left:auto}
.cm-flag.is-warn{color:var(--warn)}
.cm-items{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.cm-ev{display:flex;align-items:center;gap:5px;min-width:0;font-size:11.5px;
  color:var(--text-2);border-radius:5px;padding:1px 3px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  transition:background var(--t-hover),color var(--t-hover)}
.cm-ev:hover{background:var(--surface-3);color:var(--text)}
.cm-ev b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:10.5px}
.cm-ev-t{overflow:hidden;text-overflow:ellipsis}
.cm-ev.is-allday{background:rgba(255,255,255,.045)}
/* Source-calendar colour: a 3px edge, nothing more. */
.cm-src{width:3px;height:11px;border-radius:2px;flex-shrink:0}
.cm-due{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--p-high-ink);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cm-due i{width:5px;height:5px;border-radius:1px;background:var(--p-high);
  transform:rotate(45deg);flex-shrink:0}
.cm-more{font-size:10.5px;color:var(--muted);font-weight:600}
.cm-foot{display:flex;gap:4px;align-items:center}
.cm-chip{font-size:9.5px;font-weight:700;border-radius:4px;padding:0 4px;
  font-variant-numeric:tabular-nums}
.cm-plan{background:rgba(78,143,196,.16);color:var(--p-low-ink)}
/* Habits in a Month cell: a ratio, and quiet unless it is complete.
   A partial day is information, not a warning — nothing here goes red, because
   a missed habit is not an error and the month should not read as a scorecard. */
.cm-habit{background:rgba(0,217,163,.10);color:var(--ok);opacity:.75}
.cm-habit.is-all{background:rgba(0,217,163,.20);opacity:1}
.cm-habit.is-none{background:var(--surface-3);color:var(--muted)}
/* Workload: a restrained left edge, never a heatmap. */
.cm-cell::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;
  border-radius:2px;background:transparent;transition:background var(--t-hover)}
.cm-cell.load-busy::before{background:rgba(240,145,61,.45)}
.cm-cell.load-overloaded::before{background:rgba(240,86,110,.55)}

/* ── Agenda ── */
.cal-agenda{display:flex;flex-direction:column;gap:6px;max-width:860px}
.ag-group{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--label);margin:20px 0 6px;padding-left:2px}
.ag-group:first-child{margin-top:0}
.ag-day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:6px 0}
.ag-date{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.ag-dow{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase}
.ag-num{font-size:19px;font-weight:700;color:var(--text-2);line-height:1.1}
.ag-items{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-item{display:flex;align-items:center;gap:9px;min-width:0;width:100%;text-align:left;
  background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px;
  transition:background var(--t-hover)}
.ag-item:hover{background:var(--surface-2)}
.ag-time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:56px;flex-shrink:0}
.ag-title{flex:1;min-width:0;font-size:var(--fs-task);color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);flex-shrink:0}
.ag-src{width:3px;height:20px;border-radius:2px;flex-shrink:0}
.ag-meet{background:rgba(78,143,196,.16);color:var(--p-low-ink);border-radius:4px;
  padding:1px 5px;font-weight:600;font-size:10px}
/* Each type reads differently — never all rendered as event bars. */
.ag-reminder{background:transparent;border:1px dashed var(--border)}
.ag-reminder.is-overdue{border-color:rgba(255,196,77,.5)}
.ag-reminder.is-done .ag-title{color:var(--muted);text-decoration:line-through}
.ag-check{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--muted);
  flex-shrink:0;transition:background var(--t-hover),border-color var(--t-hover)}
.ag-check:hover{border-color:var(--ok)}
.ag-reminder.is-done .ag-check{background:var(--ok);border-color:var(--ok)}
.ag-deadline{background:transparent;border-left:2px solid var(--p-high);border-radius:0 10px 10px 0}
.ag-flag{width:7px;height:7px;background:var(--p-high);transform:rotate(45deg);flex-shrink:0}
.ag-block{background:rgba(78,143,196,.07);border-left:2px solid var(--p-low);
  border-radius:0 10px 10px 0}
.ag-plan{width:7px;height:7px;border-radius:2px;background:var(--p-low);flex-shrink:0}
.ag-badge{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-2);
  border-radius:4px;padding:1px 6px;flex-shrink:0}
.ag-badge.is-warn{background:rgba(255,196,77,.14);color:var(--warn)}
.ag-ro{opacity:.7}

/* ── Plan ── */
.cal-plan{overflow-x:auto}
.pl-grid{display:grid;grid-template-columns:54px repeat(7,minmax(112px,1fr));gap:5px;min-width:820px}
.pl-axis{display:flex;flex-direction:column;padding-top:42px}
.pl-hour{flex:1;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;
  text-align:right;padding-right:7px;transform:translateY(-6px)}
.pl-day{display:flex;flex-direction:column;min-width:0}
.pl-day-head{display:flex;align-items:baseline;gap:6px;padding:0 0 6px 2px;height:36px}
.pl-dow{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase}
.pl-num{font-size:15px;font-weight:700;color:var(--text-2)}
.pl-day.is-today .pl-num{color:var(--accent)}
.pl-allday{display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.pl-ad{font-size:10.5px;background:var(--surface-2);border-radius:5px;padding:2px 6px;
  color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-canvas{position:relative;flex:1;min-height:calc(var(--pl-hours)*46px);
  background:var(--surface);border-radius:10px;overflow:hidden}
.pl-line{display:block;height:calc(100%/var(--pl-hours));
  border-bottom:1px solid rgba(255,255,255,.045)}
.pl-ev,.pl-block{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;
  font-size:10.5px;line-height:1.28;overflow:hidden;cursor:pointer;
  transition:transform var(--d-fast) var(--e-out),box-shadow var(--t-hover)}
.pl-ev{background:var(--surface-3);border-left:3px solid var(--src, var(--accent));color:var(--text-2)}
.pl-ev:hover,.pl-block:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.pl-ev b,.pl-block b{color:var(--muted);font-variant-numeric:tabular-nums;font-size:9.5px}
.pl-block{background:rgba(78,143,196,.14);border:1px dashed rgba(78,143,196,.45);
  color:var(--p-low-ink)}
.pl-tag{display:block;font-size:9px;color:var(--muted);font-weight:600}

/* ── Plan drag ── */
.pl-block{position:absolute}
.pl-resize{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;
  border-radius:0 0 7px 7px}
.pl-resize::after{content:"";position:absolute;left:50%;bottom:2.5px;width:18px;height:2px;
  transform:translateX(-50%);border-radius:2px;background:rgba(255,255,255,.28);
  opacity:0;transition:opacity var(--t-hover)}
.pl-block:hover .pl-resize::after{opacity:1}
.pl-block.is-source{opacity:.30}
body.is-planning{cursor:grabbing;user-select:none}
[data-queue-task].is-dragging{opacity:.4}
/* The ghost IS the proposed block at its final dimensions — not a separate
   preview abstraction that can drift out of sync with the thing it previews. */
.pl-ghost{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;
  font-size:10.5px;line-height:1.3;pointer-events:none;z-index:3;overflow:hidden;
  background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--text)}
.pl-ghost b{display:block;font-variant-numeric:tabular-nums;font-size:9.5px;color:var(--text-2)}
.pl-ghost.has-clash{background:rgba(240,86,110,.14);border-color:var(--danger)}
.pl-clash{display:block;font-size:9px;color:var(--danger);font-weight:600}
/* ── Rail ── */
.cs-load{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.cs-load b{color:var(--text-2);text-transform:capitalize}
.cs-sec{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.cs-lab{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted)}
.cs-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-size:var(--fs-rail);color:var(--text-2);padding:5px 4px;border-radius:7px;min-width:0;
  transition:background var(--t-hover)}
.cs-row:hover{background:rgba(255,255,255,.035)}
.cs-row>span{font-size:10.5px;color:var(--muted);min-width:48px;flex-shrink:0;
  font-variant-numeric:tabular-nums}
.cs-row>b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-row>i{width:3px;height:15px;border-radius:2px;flex-shrink:0;background:var(--accent)}
.cs-plan{background:var(--p-low)}
.cs-rem{background:var(--warn)}
.cs-due{background:var(--p-high)}
.cs-hab{background:var(--ok)}
.cs-add{width:100%;margin-top:4px}
.rl-list{display:flex;flex-direction:column;gap:3px}
.rl-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-size:var(--fs-rail);color:var(--text-2);padding:6px 4px;border-radius:7px;min-width:0}
.rl-row.is-warn .rl-t{color:var(--warn)}
.rl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-s{font-size:10.5px;color:var(--muted);flex-shrink:0}
.rl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pq-item{background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:12px;
  color:var(--text-2);border-left:2px solid var(--p-marker,var(--muted));
  display:flex;flex-direction:column;gap:1px;cursor:grab}
.pq-item span{font-size:10px;color:var(--muted)}
.cal-note{margin-top:10px;font-size:10.5px}

@media (max-width:1280px){
  .cm-grid{grid-auto-rows:minmax(94px,auto)}
  .cm-ev-t{font-size:11px}
}
@media (max-width:900px){
  .cal-head{grid-template-columns:1fr}
  .cal-head-side{justify-content:space-between}
  /* Labels give way to dots rather than being squeezed unreadable. */
  .cm-grid{grid-auto-rows:minmax(64px,auto);gap:4px}
  .cm-items .cm-ev-t,.cm-ev b,.cm-due{display:none}
  .cm-ev{width:6px;height:6px;border-radius:50%;padding:0;background:var(--accent)}
  .cm-items{flex-direction:row;flex-wrap:wrap;gap:3px;align-items:center}
  .cm-src{display:none}
  .cm-cell{padding:5px}
  .ag-day{grid-template-columns:40px 1fr;gap:8px}
  .ag-meta{display:none}
}

/* ══ D4.1 CALENDAR REFINEMENT ════════════════════════════════════════════ */

/* ── Month cell: calmer, with habits demoted to a hairline ── */
.cm-date{padding:1px 5px;border-radius:6px}
.cm-cell.is-today .cm-date{background:var(--accent);color:#fff}
/* Selection is a border and a faint tint, not a heavy purple block that
   overwhelms its neighbours. */
.cm-cell.is-selected{border-color:var(--accent);background:rgba(138,93,255,.07);
  box-shadow:0 0 0 1px rgba(138,93,255,.35)}
